// ---------- Kamera-Scanner / 카메라 스캐너 ----------
const BD_URL = 'https://cdn.jsdelivr.net/npm/barcode-detector@3.2.3/dist/es/ponyfill.js';
let detectorP = null;
function getDetector() {
  if (!detectorP) detectorP = import(BD_URL).then(mod => {
    // Die WebAssembly-Datei von cdn.jsdelivr.net laden (wie die Bibliothek; der Service Worker hält sie offline bereit).
    // wasm 파일도 cdn.jsdelivr.net에서 받음(서비스 워커가 오프라인용으로 저장).
    mod.setZXingModuleOverrides({ locateFile: (p, pre) => p.endsWith('.wasm') ? `https://cdn.jsdelivr.net/npm/zxing-wasm@${mod.ZXING_WASM_VERSION}/dist/reader/${p}` : pre + p });
    return new mod.BarcodeDetector({ formats: ['data_matrix', 'code_39', 'ean_13', 'ean_8', 'code_128', 'qr_code'] });
  }).catch(e => { detectorP = null; throw e; });
  return detectorP;
}
const sc = { on: false, stream: null, track: null, timer: 0, busy: false, pending: null, pendingAt: 0, torch: false, err: '', msg: '', typing: false, caps: {} };
const canvas = document.createElement('canvas'), ctx = canvas.getContext('2d', { willReadFrequently: true });

// Nur echte Medikamentencodes, nach Nutzen geordnet: 3 = mit Verfallsdatum (DataMatrix, GS1-Link),
// 2 = Strichcode mit PZN/EAN, 1 = QR-Code mit bloßem Link (z. B. koreanisches e-Label).
// 진짜 약 코드만, 쓸모 순서: 3 = 유효기간 포함(네모 코드, GS1 링크), 2 = PZN/EAN 줄 바코드, 1 = 링크만 있는 QR.
function pickResult(results) {
  const rank = x => (x.c.pzn || x.c.ean) ? (x.c.exp || x.r.format === 'data_matrix' ? 3 : 2) : x.c.url ? 1 : 0;
  return results.map(r => ({ r, c: MedCode.parse(r.rawValue) }))
    .filter(x => x.c && x.c.kind !== 'pzn?')
    .map(x => ({ ...x, rank: rank(x) })).filter(x => x.rank)
    .sort((a, b) => b.rank - a.rank)[0] || null;
}

function scanHtml() {
  const l = L(), caps = sc.caps;
  const zoom = caps.zoom && caps.zoom.max > caps.zoom.min ? `<div class="zoom">${esc(l.zoom)}<input type="range" id="zoom" min="${caps.zoom.min}" max="${Math.min(caps.zoom.max, 8)}" step="${caps.zoom.step || 0.1}" value="${sc.zoomV || caps.zoom.min}"></div>` : '';
  return `<video id="vid" playsinline muted autoplay></video>
  <div class="shade"><div class="frame ${sc.pending ? 'hit' : ''}"></div></div>
  <div class="tbar"><button class="rbtn" data-act="scan-close" aria-label="${esc(l.close)}">${ms('close')}</button>
    ${caps.torch ? `<button class="rbtn ${sc.torch ? 'on' : ''}" data-act="torch">${ms(sc.torch ? 'flashlight_on' : 'flashlight_off')}</button>` : ''}</div>
  <div class="msg" id="scanmsg">${esc(sc.msg || l.scanHint)}<small>${esc(sc.msg ? '' : l.scanSub)}</small></div>

    <div class="brow"><button data-act="scan-photo">${ms('image')}${esc(l.photo)}</button><button data-act="scan-type">${ms('keyboard')}${esc(l.typeNo)}</button><button data-act="find-open">${ms('search')}${esc(l.findShort)}</button></div>

}

  if (sc.stream) { nv.srcObject = sc.stream; nv.play().catch(() => {}); }
  const z = $('#zoom');
  if (z) z.addEventListener('input', () => { sc.zoomV = +z.value; sc.track.applyConstraints({ advanced: [{ zoom: sc.zoomV }] }).catch(() => {}); });

function setMsg(t) { sc.msg = t; const m = $('#scanmsg'); if (m) m.innerHTML = esc(t || L().scanHint) + `<small>${esc(t ? '' : L().scanSub)}</small>`; }

async function startScan() {
  Object.assign(sc, { on: true, err: '', msg: L().scanLoading, pending: null, typing: false, torch: false, caps: {}, zoomV: 0 });
  drawScan();
  const det = getDetector();
  try {
    sc.stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } } });
  } catch (e) {
    console.warn(e); sc.err = L().camFail; sc.msg = ''; drawScan(); return;
  }
  if (!sc.on) return stopCam();
  sc.track = sc.stream.getVideoTracks()[0];
  try { sc.caps = sc.track.getCapabilities ? sc.track.getCapabilities() : {}; } catch (e) { sc.caps = {}; }
  if (sc.caps.focusMode && sc.caps.focusMode.includes('continuous')) sc.track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(() => {});

async function loop() {

    try {

      // 화면 가운데 부분을 원래 해상도로 잘라 읽음 → 작은 네모 코드도 읽힘.

      const hit = pickResult(res);
      if (hit && hit.rank === 3) return finish(hit.c);

    // 줄 바코드를 찾았으면 1.3초 더 네모 코드(유효기간 포함)를 찾아봄.

<script src="firebase-config.js"></script>
<script type="module">
// ---------- Familie teilen (Firebase) / 가족과 공유 ----------
// Gleiches Firebase-Projekt und gleicher Familiencode wie Einkaufsliste/Reisen; die Medikamente liegen im eigenen
// Dokument households/{Code}_meds als Karte meds.{id}. Jede Änderung geht als einzelnes Feld hoch.
// 장보기·여행과 같은 Firebase, 같은 가족 코드. 약은 households/{코드}_meds 문서의 meds.{id}에 저장.
// 바뀐 약만 필드 단위로 올려서 두 휴대폰이 서로 덮어쓰지 않게 함.
const cfg = window.FIREBASE_CONFIG;
if (cfg) {
  const V = 'https://www.gstatic.com/firebasejs/10.12.2/';
  const [{ initializeApp }, A, F] = await Promise.all(
    [import(V + 'firebase-app.js'), import(V + 'firebase-auth.js'), import(V + 'firebase-firestore.js')]);
  const fb = initializeApp(cfg), auth = A.getAuth(fb);
  const db = F.initializeFirestore(fb, { localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) });
  const S = () => window.meds.S();
  const keep = () => { try { localStorage.setItem('meds:v1', JSON.stringify(S())); } catch (e) {} };
  // Stabile Schreibweise auch für verschachtelte Felder (z. B. info). / 안쪽 객체까지 순서를 맞춘 비교용 글자.
  const deep = v => Array.isArray(v) ? v.map(deep) : v && typeof v === "object" ? Object.fromEntries(Object.keys(v).sort().map(k => [k, deep(v[k])])) : v;
  const sig = o => JSON.stringify(deep(o));
  const house = code => F.doc(db, "households", code);
  const warn = e => console.warn("sync", e);
  // Zwei Dokumente: Packungen (meds) und das Arzneimittel-Lexikon (cat), damit keines an die 1-MB-Grenze stößt.
  // 문서 두 개: 약 통(meds)과 약 사전(cat). 한 문서가 1MB 한도에 닿지 않게 나눔.
  const CH = [{ field: "meds", suffix: "_meds" }, { field: "cat", suffix: "_medcat" }, { field: "log", suffix: "_medlog" }];
  for (const c of CH) { c.unsub = null; c.first = true; c.ref = (code = S().house) => F.doc(db, "households", code + c.suffix); }

  function changes(c) {
    const out = {}, s = S(), base = (s.remote && s.remote[c.field]) || {}, local = s[c.field] || {};
    for (const id in local) if (!base[id] || sig(local[id]) !== sig(base[id])) out[id] = JSON.parse(JSON.stringify(local[id]));
    for (const id in base) if (!local[id]) out[id] = F.deleteField();
    return out;
  }
  function send(c) {
    const ch = changes(c), ids = Object.keys(ch), any = ids.length > 0;
    if (any) try {
      const args = ids.flatMap(id => [new F.FieldPath(c.field, id), ch[id]]);
      F.updateDoc(c.ref(), ...args).catch(warn);
    } catch (e) { warn(e); }
    return any;
  }
  function push() { for (const c of CH) if (c.unsub && !c.first && S().house) send(c); }
  function listenOne(c) {
    c.first = true;
    c.unsub = F.onSnapshot(c.ref(), async snap => {
      if (!snap.exists()) {
        // Erstes Gerät der Familie: Dokument anlegen; danach kommt der Schnappschuss erneut.
        // 가족 중 처음 쓰는 기기: 문서를 만들면 다시 알림이 옴.
        await F.setDoc(c.ref(), { [c.field]: {}, created: Date.now() }, { merge: true }).catch(warn);
        return;
      }
      if (c.first) { c.first = false; if (send(c)) return; }
      const d = snap.data(), s = S();
      s.remote = s.remote || {};
      s.remote[c.field] = JSON.parse(JSON.stringify(d[c.field] || {})); s.remoteOf = s.house;
      s[c.field] = JSON.parse(JSON.stringify(d[c.field] || {}));
      keep();
      window.meds.render();
    }, warn);
  }
  function listen() { stop(); for (const c of CH) listenOne(c); }
  function stop() { for (const c of CH) { if (c.unsub) c.unsub(); c.unsub = null; } }
  const listening = () => CH.some(c => c.unsub);
  async function link(code) {
    const s = S(); s.house = code; if (s.remoteOf !== code) s.remote = null; s.remoteOf = code; keep();
    await F.setDoc(F.doc(db, "users", auth.currentUser.uid), { house: code }, { merge: true });
    listen(); window.meds.render();
  }

  window.cloud = {
    ready: false, user: null, note: '', push,
    // Für den Abruf-Server (meds-fetch): Anmeldenachweis / 설명서 가져오기 서버용 로그인 증명
    token: () => auth.currentUser ? auth.currentUser.getIdToken() : Promise.resolve(null),
    // Einkaufsliste der Familie (gleiches Dokument wie die App „장보기“) / 가족 장보기 목록(장보기 앱과 같은 문서)
    async shopStores(lang) {
      const d = (await F.getDoc(house(S().house))).data() || {};
      const names = lang === "de" ? { super: "Supermarkt", asia: "Asia-Markt", online: "Internet" } : { super: "슈퍼마켓", asia: "아시아 마켓", online: "인터넷" };
      const rank = x => (["super", "asia", "online"].indexOf(x.id) + 1) || 9;
      const list = Object.values(d.stores || {}).sort((a, b) => rank(a) - rank(b));
      return (list.length ? list : [{ id: "super", key: "super" }]).map(x => ({ id: x.id, label: x.key ? names[x.key] || x.key : x.name || x.id }));
    },
    async putImg(k, d) { await F.setDoc(F.doc(db, "households", S().house + "_img_" + k), { d, t: Date.now() }); },
    async getImg(k) { const x = await F.getDoc(F.doc(db, "households", S().house + "_img_" + k)); return x.exists() ? x.data().d : null; },
    async addShop(store, name) {
      const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
      await F.updateDoc(house(S().house), { [`items.${id}`]: { id, store, name } });
    },
    signIn: () => A.signInWithPopup(auth, new A.GoogleAuthProvider()),
    async signOut() { stop(); const s = S(); delete s.house; keep(); await A.signOut(auth); },
    async create() {
      const abc = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      const code = [...crypto.getRandomValues(new Uint8Array(10))].map(n => abc[n % abc.length]).join('');
      await F.setDoc(house(code), { stores: {}, items: {}, stock: {}, created: Date.now() });
      await link(code);
    },
    async join(code) {
      code = String(code || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (!code || !(await F.getDoc(house(code))).exists()) return false;
      await link(code);
      return true;
    },
  };

  A.onAuthStateChanged(auth, async user => {
    window.cloud.user = user;
    const s = S();
    if (!user) stop();
    else {
      if (!s.house) try {
        const u = await F.getDoc(F.doc(db, 'users', user.uid));
        if (u.exists() && u.data().house) { s.house = u.data().house; if (s.remoteOf !== s.house) s.remote = null; keep(); }
      } catch (e) { warn(e); }
      if (s.house && !listening()) listen();
    }
    window.cloud.ready = true;
    window.meds.render();
  });
}
</script>
