<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>약상자 · Hausapotheke</title>
<meta name="theme-color" content="#f7efe1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="약상자">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" crossorigin href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<link rel="stylesheet" crossorigin href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,1,0&icon_names=add,barcode_reader,check,check_circle,checklist,child_care,close,cloud_done,delete,download,edit,error,event,flashlight_off,flashlight_on,history,image,info,inventory_2,keyboard,notifications,open_in_new,photo_camera,pill,qr_code_scanner,restore,schedule,search,settings,shopping_cart,sick,thermometer,upload,warning&display=block">
<style>
:root {
  --red: #d9443a; --red2: #b8352d; --cream: #f7efe1; --ink: #3a2a20; --mut: #8a7562; --line: #eadfcd; --card: #fff;
  --wood: #d0a46c; --wood2: #b4834e; --cab: #a87a47; --cab2: #8c6235;
  --bad: #e5484d; --soon: #f0a020; --ok: #3aa76d; --none: #b3a796;
  --davin: #ffe27a; --davink: #7a5b00; --arin: #e8c6f5; --arink: #8a3fb0;
  --jua: "Jua", -apple-system, "Apple SD Gothic Neo", sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
/* Kein Zoom durch Doppeltippen / 두 번 터치해도 확대되지 않게 */
html, body, button, a, input, label, select, textarea, .sheet, .tray, .row-x { touch-action: manipulation; }
html, body { margin: 0; background: var(--cream); color: var(--ink); font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", "Noto Sans KR", Roboto, sans-serif; }
body { padding: env(safe-area-inset-top) 0 calc(100px + env(safe-area-inset-bottom)); }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
.ms { font-family: 'Material Symbols Rounded'; font-weight: normal; font-style: normal; font-size: 22px; line-height: 1; letter-spacing: normal; text-transform: none; display: inline-block; white-space: nowrap; direction: ltr; -webkit-font-smoothing: antialiased; vertical-align: middle; }
.wrap { max-width: 640px; margin: 0 auto; padding: 0 12px; }

/* Deckel / 구급상자 뚜껑 */
.lid { background: var(--red); color: #fff; margin: 22px 0 0; border-radius: 20px 20px 12px 12px; padding: 12px 12px 12px; position: relative; box-shadow: inset 0 -6px 0 var(--red2); }
.lid::before { content: ''; position: absolute; left: 50%; top: -12px; width: 66px; height: 20px; transform: translateX(-50%); border: 6px solid #6b5b52; border-bottom: 0; border-radius: 14px 14px 0 0; }
.lid .t { display: flex; align-items: center; gap: 6px; }
.wc { width: 32px; height: 32px; background: #fff; border-radius: 9px; position: relative; flex: none; }
.wc::before, .wc::after { content: ''; position: absolute; background: var(--red); border-radius: 2px; }
.wc::before { left: 12px; top: 6px; width: 8px; height: 20px; } .wc::after { left: 6px; top: 12px; width: 20px; height: 8px; }
.lid b { font: 400 18px var(--jua); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-left: 2px; }
.lbtn { border: 0; background: rgba(0,0,0,.18); color: #fff; border-radius: 10px; height: 32px; min-width: 32px; padding: 0 6px; flex: none; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; }
.lbtn .ms { font-size: 20px; }

/* Zettel und Korb / 포스트잇과 바구니 */
.post { margin: 14px 6px 0; background: #fff3a8; padding: 9px 12px; transform: rotate(-1deg); box-shadow: 0 3px 6px rgba(0,0,0,.12); font: 400 15px var(--jua); position: relative; display: flex; gap: 8px; align-items: center; }
.post::before { content: ''; position: absolute; top: -7px; left: 44%; width: 46px; height: 14px; background: rgba(255,255,255,.65); transform: rotate(3deg); }
.post.ok { background: #d9f2c9; } .post .ms { color: var(--ok); }
.basket { margin: 14px 0 0; border-radius: 6px 6px 22px 22px; padding: 6px 6px 4px; background: repeating-linear-gradient(90deg, #e8cb97 0 7px, #dcb97f 7px 14px); border-top: 6px solid #c79a5c; box-shadow: 0 3px 0 #b78c52; }
.basket h5 { margin: 0 4px; font: 400 14px var(--jua); display: flex; align-items: center; gap: 4px; }
.basket h5 .ms { font-size: 18px; color: var(--bad); }
.basket .row-x { background: #fff; border-radius: 12px; margin: 5px 0 2px; padding: 0 4px; box-shadow: inset 0 1px 3px rgba(90,60,30,.25); }
.basket h5 small { background: var(--bad); color: #fff; border-radius: 8px; padding: 0 6px; font-size: 11px; }
.row-x { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.row-x::-webkit-scrollbar { display: none; }

/* Ein Medikament als Bild / 약 그림 하나 */
.it { flex: 0 0 72px; border: 0; background: none; padding: 8px 0 0; text-align: center; position: relative; color: var(--ink); }
.it svg { display: block; margin: 0 auto; height: 58px; }
.it .lb { display: block; font-size: 10px; line-height: 1.15; height: 24px; overflow: hidden; margin-top: 2px; font-weight: 600; word-break: break-word; }
.dot { position: absolute; top: 0; right: 2px; min-width: 30px; height: 30px; padding: 0 4px; border-radius: 15px; color: #fff; display: grid; place-items: center; font: 400 10px var(--jua); box-shadow: 0 2px 3px rgba(0,0,0,.2); transform: rotate(8deg); white-space: nowrap; }
.dot.bad, .sd.bad { background: var(--bad); } .dot.soon, .sd.soon { background: var(--soon); } .dot.ok, .sd.ok { background: var(--ok); } .dot.none, .sd.none, .dot.gone, .sd.gone { background: var(--none); }
.stack { position: relative; display: block; height: 58px; }
.stack svg, .stack .ph { margin: 0 auto; }
.x2 { position: absolute; left: 0; bottom: -2px; background: #fff; color: var(--ink); border: 1.5px solid var(--ink); border-radius: 8px; font: 400 10px/1.4 var(--jua); padding: 0 4px; box-shadow: 0 1px 2px rgba(0,0,0,.15); white-space: nowrap; }
.sbars { display: flex; gap: 3px; margin: 2px 8px 0; }
.sbars .sbar2 { flex: 1; margin: 0; }

/* Leiste: Personen, Suche, Ansicht / 사람·검색·보기 */
.bar { display: flex; align-items: center; gap: 4px; margin: 14px 0 0; }
.who { flex: 1; min-width: 0; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.who::-webkit-scrollbar { display: none; }
.who button { flex: none; border: 0; background: #fff; border-radius: 999px; padding: 5px 8px; font-size: 13px; font-weight: 700; box-shadow: inset 0 -2px 0 #e7dccb; }
.who button.on { background: var(--ink); color: #fff; box-shadow: none; }
.ib { flex: none; border: 0; width: 34px; height: 34px; border-radius: 50%; background: #fff; display: grid; place-items: center; box-shadow: inset 0 -2px 0 #e7dccb; }
.ib.on { background: var(--ink); color: #fff; }
.vt { flex: none; display: flex; background: #eadfcd; border-radius: 10px; padding: 2px; font-size: 12px; font-weight: 700; }
.vt button { border: 0; background: none; padding: 5px 9px; border-radius: 8px; color: var(--mut); }
.vt button.on { background: #fff; color: var(--red); box-shadow: 0 1px 2px rgba(0,0,0,.1); }
.search { display: flex; align-items: center; gap: 6px; background: #fff; border-radius: 14px; padding: 0 12px; height: 42px; margin-top: 10px; box-shadow: inset 0 -2px 0 #e7dccb; }
.search input { border: 0; outline: 0; flex: 1; background: transparent; min-width: 0; }
.search .ms { color: var(--mut); }

/* Schrank / 서랍장 */
.cab { margin: 12px 0 0; background: var(--cab); border-radius: 14px; padding: 5px; box-shadow: inset 0 -4px 0 var(--cab2); }
.dr { width: 100%; border: 0; display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 10px; border-radius: 9px; background: linear-gradient(#ddb37d, var(--wood)); box-shadow: inset 0 -3px 0 var(--wood2), inset 0 1px 0 rgba(255,255,255,.35); color: var(--ink); text-align: left; }
.dr + .dr, .tray + .dr { margin-top: 5px; }
.plate { flex: none; background: #fffaf0; border: 2px solid #9aa0a6; border-radius: 4px; padding: 0 8px; font: 400 14px/1.5 var(--jua); color: var(--ink); min-width: 84px; text-align: center; }
.cnt { font: 400 13px var(--jua); color: #5a3f22; flex: none; }
.pips { flex: 1; display: flex; flex-wrap: wrap; gap: 3px; min-width: 0; }
.pips i { width: 9px; height: 9px; border-radius: 50%; display: block; box-shadow: 0 0 0 1.5px rgba(255,255,255,.7); }
.knob { flex: none; width: 16px; height: 16px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #e9ecef, #8a9096); box-shadow: 0 1px 2px rgba(0,0,0,.3); }
.dr.open { border-radius: 9px 9px 0 0; }
.dr.open .knob { background: radial-gradient(circle at 35% 35%, #fff, #b0b5ba); }
.tray { background: #fff; border-radius: 0 0 9px 9px; box-shadow: inset 0 6px 6px -5px rgba(90,60,30,.3); padding: 4px 6px 2px; }

/* Liste / 목록 보기 */
.sec { margin: 12px 0 0; background: #fff; border-radius: 18px; padding: 4px 12px 2px; }
.sec .sh { display: flex; align-items: center; gap: 6px; padding: 6px 0; font: 400 13px var(--jua); }
.sec .sh .plate { min-width: 0; font-size: 13px; }
.sec .sh small { color: var(--mut); font-family: inherit; font-size: 12px; }
.lr { width: 100%; border: 0; background: none; display: flex; align-items: center; gap: 10px; padding: 6px 0; border-top: 1px solid #f1e8da; text-align: left; color: var(--ink); }
.lr svg { height: 34px; flex: none; width: 24px; }
.lr .nm { flex: 1; min-width: 0; font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lr .nm small { display: block; font-weight: 500; color: var(--mut); font-size: 11px; overflow: hidden; text-overflow: ellipsis; }
.sd { flex: none; min-width: 48px; text-align: center; border-radius: 999px; color: #fff; font: 400 12px/22px var(--jua); padding: 0 7px; }
.kid { display: inline-flex; align-items: center; border-radius: 7px; padding: 0 6px; font-size: 12px; font-weight: 700; }
.kid.davin { background: #fff3c2; color: var(--davink); } .kid.arin { background: #f6e5fb; color: var(--arink); }
.kid.kids { background: #e5f0ff; color: #2c6db5; } .kid.adult { background: #f1e8da; color: var(--mut); }
.empty { text-align: center; color: var(--mut); padding: 30px 10px; font: 400 15px var(--jua); }
.morebtn { display: block; margin: 16px auto 0; border: 0; background: none; color: var(--mut); font-size: 14px; }

.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; padding: 10px 12px calc(12px + env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--cream) 65%, rgba(247,239,225,0)); }
.dock .wrap { display: flex; gap: 10px; padding: 0; }
.big { flex: 1; height: 56px; border: 0; border-radius: 18px; background: var(--red); color: #fff; font: 400 19px var(--jua); display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: inset 0 -4px 0 var(--red2), 0 6px 14px rgba(217,68,58,.3); }
.big .ms { font-size: 26px; }
.big.sec2 { flex: none; width: 56px; background: #fff; color: var(--red); box-shadow: inset 0 -3px 0 #e7dccb, 0 2px 8px rgba(0,0,0,.08); }

/* Blätter / 시트 */
.sheetbg { position: fixed; inset: 0; z-index: 20; background: rgba(40,25,15,.38); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--cream); width: 100%; max-width: 640px; max-height: 94vh; max-height: 94dvh; border-radius: 24px 24px 0 0; overflow-y: auto; padding: 0 14px calc(20px + env(safe-area-inset-bottom)); }
.sbar { position: sticky; top: 0; z-index: 2; background: var(--cream); display: flex; align-items: center; gap: 8px; padding: 12px 0 10px; }
.sbar h2 { flex: 1; margin: 0; font: 400 19px var(--jua); text-align: center; }
.sbar .txtbtn { border: 0; background: none; color: var(--red); font: 400 17px var(--jua); padding: 6px 4px; min-width: 56px; }
.sbar .txtbtn.l { text-align: left; color: var(--mut); }
.sbar .txtbtn.r { text-align: right; }
.box { background: var(--card); border-radius: 18px; padding: 14px; margin-bottom: 10px; }
.box h3 { margin: 0 0 6px; font: 400 15px var(--jua); color: var(--red); display: flex; align-items: center; gap: 6px; }
.box h3 .ms { font-size: 18px; }
label.f { display: block; font-size: 13px; color: var(--mut); font-weight: 700; margin: 12px 0 4px; }
label.f:first-child { margin-top: 0; }
.in { width: 100%; max-width: 100%; min-width: 0; border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; background: #fffcf6; outline: 0; min-height: 44px; font-size: 16px; }
/* iPhone: Datumsfelder haben sonst eine feste Mindestbreite und ragen über den Rand.
   아이폰: 날짜 칸은 원래 최소 폭이 있어서 테두리 밖으로 넘침 → 기본 모양을 끄고 폭을 맞춤 */
input.in[type=date], input.in[type=month] { -webkit-appearance: none; appearance: none; display: block; min-width: 0; text-align: left; line-height: 22px; }
input.in[type=date]::-webkit-date-and-time-value, input.in[type=month]::-webkit-date-and-time-value { text-align: left; }
.in:focus { border-color: var(--red); background: #fff; }
textarea.in { min-height: 76px; resize: vertical; }
.row2 { display: flex; gap: 8px; } .row2 > * { flex: 1; min-width: 0; }
.inrow { display: flex; gap: 6px; align-items: center; } .inrow .in { flex: 1; min-width: 0; }
.mini { border: 1.5px solid var(--line); background: var(--card); border-radius: 10px; padding: 0 10px; height: 44px; font-size: 14px; white-space: nowrap; }
.wrapchips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 8px 0 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1.5px solid var(--line); background: var(--card); border-radius: 999px; padding: 5px 12px; font-size: 14px; white-space: nowrap; }
.chip.on { background: var(--ink); border-color: var(--ink); color: #fff; font-weight: 700; }
.chip.plate-c { font-family: var(--jua); border-radius: 6px; border-color: #c9ccd0; background: #fffaf0; }
.chip.plate-c.on { background: var(--wood); border-color: var(--wood2); color: var(--ink); box-shadow: inset 0 -2px 0 var(--wood2); }
.hint { font-size: 13px; color: var(--mut); margin: 6px 0 0; }
.hint.ok { color: var(--ok); font-weight: 700; }
.codeline { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 13px; color: var(--mut); }
.codeline b { color: var(--ink); font-weight: 600; }
.links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.links a { display: inline-flex; align-items: center; gap: 4px; text-decoration: none; color: var(--red2); background: #fbe9e6; border-radius: 10px; padding: 6px 10px; font-size: 14px; font-weight: 700; }
.links a .ms { font-size: 16px; }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.btn { flex: 1; border: 0; border-radius: 16px; height: 50px; padding: 0 14px; background: var(--red); color: #fff; font: 400 17px var(--jua); display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; box-shadow: inset 0 -3px 0 var(--red2); }
.btn.ghost { background: var(--card); color: var(--ink); box-shadow: inset 0 -3px 0 #e7dccb; }
.btn.danger { background: var(--card); color: var(--bad); box-shadow: inset 0 -3px 0 #f3d2d3; }
.btn.small { height: 42px; font-size: 15px; flex: none; }
.note { font-size: 12px; color: var(--mut); line-height: 1.5; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom)); z-index: 60; background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 14px; max-width: 90vw; box-shadow: 0 6px 20px rgba(0,0,0,.2); }
.ok-t { color: var(--ok); font-weight: 700; }

/* Detail / 상세 */
.hero { background: #fff; border-radius: 22px; padding: 14px; display: flex; gap: 12px; align-items: center; position: relative; margin-top: 18px; }
.hero svg { height: 110px; flex: none; }
.hero h2 { margin: 0; padding-right: 64px; font: 400 21px/1.2 var(--jua); word-break: break-word; }
.hero .s { font-size: 13px; color: var(--mut); margin-top: 3px; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.bigdot { position: absolute; right: 6px; top: -12px; min-width: 70px; height: 70px; padding: 0 6px; border-radius: 35px; color: #fff; display: grid; place-items: center; text-align: center; font: 400 11px/1.15 var(--jua); transform: rotate(10deg); box-shadow: 0 3px 6px rgba(0,0,0,.2); }
.bigdot b { font-size: 17px; display: block; font-weight: 400; }
.bigdot.bad { background: var(--bad); } .bigdot.soon { background: var(--soon); } .bigdot.ok { background: var(--ok); } .bigdot.none, .bigdot.gone { background: var(--none); }
.tagc { margin: 12px 6px 10px; background: #fffaf0; border: 2px solid #e6d7bf; border-radius: 6px 20px 20px 6px; padding: 10px 14px 10px 30px; position: relative; font-size: 14px; }
.tagc::before { content: ''; position: absolute; left: 9px; top: 50%; width: 11px; height: 11px; margin-top: -6px; border-radius: 50%; background: var(--cream); border: 2px solid #e6d7bf; }
.tagc .r { display: flex; justify-content: space-between; gap: 10px; padding: 2px 0; }
.tagc .r span:first-child { color: var(--mut); }
.tagc .r.main { font-weight: 800; }
.tagc .r.main.bad, .tagc .r.main.bad span { color: var(--bad); } .tagc .r.main.soon, .tagc .r.main.soon span { color: #c77c00; } .tagc .r.main.ok, .tagc .r.main.ok span { color: var(--ok); }
.tagc .why { font-size: 12px; color: var(--mut); margin-top: 4px; }
.tagc .warn { font-size: 12px; color: #c77c00; font-weight: 700; margin-top: 4px; }
.kc { display: flex; gap: 8px; margin-bottom: 10px; }
.kc div { flex: 1; background: #fff; border-radius: 18px; padding: 10px; text-align: center; min-width: 0; }
.face { width: 46px; height: 46px; border-radius: 50%; margin: 0 auto 4px; display: grid; place-items: center; font: 400 14px var(--jua); white-space: nowrap; }
.face.davin { background: var(--davin); color: var(--davink); } .face.arin { background: var(--arin); color: var(--arink); }
.kc b { font: 400 18px var(--jua); display: block; word-break: break-word; }
.pre { white-space: pre-wrap; margin: 0; }
.same { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: none; padding: 6px 0; border-top: 1px solid #f1e8da; text-align: left; }
.same:first-of-type { border-top: 0; }
.same span:first-child { flex: 1; font-size: 14px; }
.sugg { display: flex; flex-direction: column; gap: 4px; margin-top: 4px; }
.sugg:empty { display: none; }
.sug { display: flex; align-items: center; gap: 8px; border: 1.5px solid var(--line); background: #fffaf0; border-radius: 12px; padding: 4px 10px; text-align: left; }
.sug svg { height: 26px; width: 18px; flex: none; }
.sug span { font-weight: 700; font-size: 14px; } .sug small { display: block; font-weight: 500; color: var(--mut); font-size: 11px; }
.info .src { color: var(--mut); font-family: -apple-system, sans-serif; font-size: 12px; }
.ph { display: block; margin: 0 auto; object-fit: contain; border-radius: 4px; background: #fff; }
.lr .ph, .mp .ph, .sug .ph { margin: 0; flex: none; }
.urlrow { display: flex; gap: 6px; margin-top: 10px; }
.urlrow .in { flex: 1; min-width: 0; }
.urlrow .btn { flex: none; }
.phrow { display: flex; gap: 12px; align-items: center; }
.phbig { width: 110px; height: 110px; object-fit: cover; border-radius: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.15); flex: none; }
.phnone { width: 110px; height: 110px; display: grid; place-items: center; background: #f4ece0; border-radius: 14px; flex: none; }
.phbtns { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.srcbadge { flex: none; width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; font: 400 12px var(--jua); color: #fff; }
.srcbadge.de { background: #444; } .srcbadge.kr { background: #2c6db5; }
.rec { display: flex; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid #f1e8da; }
.rec:first-of-type { border-top: 0; }
.rec .ph, .rec svg { flex: none; }
.rb { flex: 1; min-width: 0; } .rb b { display: block; font-size: 14px; }
.rb small { display: block; font-size: 12px; color: var(--mut); margin-top: 1px; }
.mp .bad-t { color: var(--bad); font-weight: 700; }
.rb .kdl { color: var(--ink); } .rb .bad-t { color: var(--bad); font-weight: 700; } .rb .soon-t { color: #c77c00; font-weight: 700; }
.linkbtn { border: 0; background: none; color: var(--red2); font-weight: 700; font-size: 14px; padding: 6px 0 0; display: inline-flex; align-items: center; gap: 4px; }
.linkbtn .ms { font-size: 18px; }

<div id="app"></div>
<div id="sheet"></div>
<div id="scan"></div>
<input type="file" id="photo" accept="image/*" hidden>

<script src="codes.js"></script>
<script src="leaflet.js"></script>
<script>
// ---------- Hausapotheke / 약상자 ----------
// Daten: S.meds = { id → Packung }. Eine Packung = { name, kind, use, drawer, who, exp, opened, openDays,
// dose, doseDavin, doseArin, note, pzn, ean, code, batch, serial, gone, created, updated }.
// Gilt bis = früheres Datum aus aufgedrucktem Verfall und (Anbruch + Haltbarkeit nach Anbruch).
// Aussehen: Erste-Hilfe-Kasten mit „Erst ansehen“-Korb oben und Schubladen nach Anwendung.
// 데이터: S.meds = { id → 약 한 통 }. 실제 기한 = 인쇄된 유효기간과 (개봉일 + 개봉 후 기간) 중 빠른 날.
// 모양: 구급상자. 맨 위 "먼저 볼 약" 바구니, 아래는 용도별 서랍(또는 목록 보기).
const KEY = 'meds:v1', UIKEY = 'meds:ui';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ms = n => `<span class="ms">${n}</span>`;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

let S = (() => {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.meds) return s; } catch (e) {}
  return { meds: {}, lang: /^de/i.test(navigator.language) ? 'de' : 'ko' };
})();
const keep = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

// ---------- Arzneimittel-Lexikon / 약 사전 ----------
// Angaben zur Sorte (nicht zur einzelnen Packung) bleiben in S.cat, auch wenn die Packung gelöscht wird.
// Schlüssel: Barcode (pzn:/ean:/raw:) oder sonst der Name. Die Familie teilt es (Dokument households/{Code}_medcat).
// 약 종류 정보(통 하나가 아니라 제품)는 S.cat에 남음. 약을 지워도 사라지지 않음. 열쇠는 바코드, 없으면 이름.
// 가족이 함께 씀(households/{코드}_medcat 문서).
S.cat = S.cat || {};

// ---------- Kinder: Alter und Dosis / 아이 나이와 용량 ----------
// Geburtsmonat und freiwillig Gewicht werden in den Einstellungen eingetragen und liegen nur im privaten
// Familien-Dokument (Lexikon-Eintrag „@kids“) – nie im öffentlichen Code.
// 생년월과 몸무게(선택)는 설정에서 넣고, 가족만 보는 Firebase 문서(사전의 '@kids')에만 저장. 공개 코드에는 넣지 않음.
const KIDS = ['davin', 'arin'];
const kidsData = () => S.cat['@kids'] || S.kids || {};
const kidOf = w => kidsData()[w] || {};
function kidMonths(w) {
  const b = kidOf(w).birth;
  if (!/^\d{4}-\d{2}$/.test(b || '')) return -1;
  const now = new Date();
  return (now.getFullYear() * 12 + now.getMonth()) - (+b.slice(0, 4) * 12 + (+b.slice(5, 7) - 1));
}
const kidAgeText = mo => mo < 0 ? '' : S.lang === 'de' ? `${Math.floor(mo / 12)} J. ${mo % 12} M.` : `만 ${Math.floor(mo / 12)}세 ${mo % 12}개월`;
// Deutsche Häufigkeit kurz auf Koreanisch / 독일어 횟수 표현을 한국어로
function freqKo(f) {
  if (S.lang !== 'ko' || !f) return f;
  return f.replace(/bis zu (\d+)[- ]?mal (?:täglich|am Tag|pro Tag)/i, '하루 최대 $1번')
    .replace(/(\d+)[- ]?(?:bis (\d+)[- ]?)?mal (?:täglich|am Tag|pro Tag)/i, (m, a, b) => `하루 ${b ? a + '~' + b : a}번`)
    .replace(/alle (\d+(?:\s*[-–]\s*\d+)?) Stunden/i, '$1시간마다')
    // Tabellenwert „3mal“ / „3 - 4mal“ (höchstens pro Tag) / 표의 '3mal'(하루 최대)
    .replace(/^(\d+)(?:\s*-\s*(\d+))?\s*-?mal\b(?!ig).*$/i, (x, a, b) => `하루 최대 ${b ? a + '~' + b : a}번`);
}
// Dosis eines Kindes aus dem Dosierungstext; leer, wenn nichts passt. / 용량 글에서 아이 한 명 용량(없으면 빈 값)
function kidDoseText(section, w) {
  const mo = kidMonths(w);
  const r = MedLeaflet.kidDose(section, { months: mo, kg: +kidOf(w).kg || 0 });
  if (!r) return '';
  if (r.warn) return `⚠ ${L().kidNo} (${r.text.slice(0, 80)})`;
  return [r.amount, freqKo(r.freq)].filter(Boolean).join(' · ') + (r.range ? ` (${r.range})` : '');
}
// Für wen gilt das Mittel? Erwachsene-Mittel bekommen keine Kinderdosis. / 어른 약이면 아이 용량은 계산 안 함
const kidsFor = who => who === 'adult' ? [] : who === 'davin' ? ['davin'] : who === 'arin' ? ['arin'] : KIDS;
// overwrite: true = neu rechnen (Knopf), false = nur leere Felder / true면 다시 계산, false면 빈 칸만
function fillKids(d, section, overwrite) {
  const got = [];
  if (!section) return got;
  for (const w of kidsFor(d.who || '')) {
    const f = w === 'davin' ? 'doseDavin' : 'doseArin';
    if (d[f] && !overwrite) continue;
    const t = kidDoseText(section, w);
    if (t) { d[f] = t; got.push(L().who[w]); }
  }
  return got;
}
const PROD = ['name', 'kind', 'use', 'drawer', 'who', 'openDays', 'dose', 'doseDavin', 'doseArin', 'note', 'pzn', 'ean', 'code', 'itemSeq', 'entp', 'atc', 'ingr', 'link', 'leaflet', 'info'];
const nameKey = n => n ? 'n:' + String(n).trim().toLowerCase() : '';
const catKey = m => m.code || nameKey(m.name);
const catOf = m => S.cat[catKey(m)] || S.cat[nameKey(m.name)] || null;
function toCat(m) {
  const k = catKey(m);
  if (!k) return null;
  const e = { ...(S.cat[k] || {}) };
  for (const f of PROD) if (m[f] !== undefined && m[f] !== '' && m[f] !== 0) e[f] = m[f];
  e.updated = Date.now();
  return (S.cat[k] = e);
}
// Erstbefüllung aus den vorhandenen Packungen (ältere zuerst, neuere gewinnen). / 처음 한 번: 있는 약으로 사전 만들기.
if (!Object.keys(S.cat).length) Object.values(S.meds).sort((a, b) => (a.updated || 0) - (b.updated || 0)).forEach(toCat);
// Ansicht und offene Schubladen merkt sich jedes Gerät selbst. / 보기 방식과 열린 서랍은 기기마다 기억.
const ui = Object.assign({ view: 'shelf', who: 'all', q: '', searching: false, showGone: false, open: [], sheet: null, draft: null },
  (() => { try { return JSON.parse(localStorage.getItem(UIKEY)) || {}; } catch (e) { return {}; } })());
const keepUi = () => { try { localStorage.setItem(UIKEY, JSON.stringify({ view: ui.view, open: ui.open, box: ui.box })); } catch (e) {} };

const DRAWERS = ['pain', 'cold', 'belly', 'skin', 'eye', 'etc'];
const T = {
  ko: {
    title: '우리집 구급상자', scan: '약 스캔하기', add: '직접 추가', search: '약 이름, 용도 검색',
    whoAll: n => `전체 ${n}`, shelf: '선반', list: '목록',
    basket: '먼저 볼 약', allOk: n => `모든 약이 괜찮아요 · 약 ${n}개`, empty: '아직 약이 없어요. 아래 버튼으로 약 상자를 스캔해 보세요',
    drawers: { pain: '열·통증', cold: '감기·코', belly: '배', skin: '피부·상처', eye: '눈·귀', etc: '알레르기·기타' },
    cnt: n => `${n}개`, emptyList: '맞는 약이 없어요', showGone: n => `다 쓴 약 ${n}개 보기`, hideGone: '다 쓴 약 숨기기', goneTitle: '다 쓴 약',
    toss: '버려요', dShort: d => d > 999 ? 'D-999+' : `D-${d}`, todayShort: '오늘까지', none: '?',
    dLeft: n => `D-${n}`, dToday: '오늘까지', dPast: n => `${n}일 지남`, noExp: '기한 미입력',
    who: { '': '가족 모두', adult: '어른', kids: '아이들', davin: '다빈', arin: '아린' },
    kinds: { tab: '알약·캡슐', syrup: '시럽·물약', drops: '안약·점비약', spray: '스프레이', cream: '연고·크림', supp: '좌약', etc: '기타' },
    uses: [['열·통증', 'pain'], ['감기', 'cold'], ['기침', 'cold'], ['코', 'cold'], ['배탈·설사', 'belly'], ['피부·상처', 'skin'], ['눈', 'eye'], ['귀', 'eye'], ['알레르기', 'etc']],

// Schublade: gewählt oder aus Anwendung/Name geraten. / 서랍: 고른 것, 없으면 용도·이름으로 추측.
function guessDrawer(text) {

  if (pu) pu.addEventListener('paste', e => {
    const f = [...((e.clipboardData && e.clipboardData.files) || [])].find(x => /^image\//.test(x.type));

      return;

    setTimeout(() => { if (/^(https?:|data:image)/i.test(pu.value.trim())) ACT['photo-url'](); }, 0);

  for (const x of document.querySelectorAll('#medform [name=expText], #pexp')) x.addEventListener('input', () => { const h = $(x.id === 'pexp' ? '#pexphint' : '#exphint'); if (h) h.outerHTML = expHint(x.value).replace('id="exphint"', `id="${x.id === 'pexp' ? 'pexphint' : 'exphint'}"`); });
  const nm = $('#medform [name=name]');
  if (nm) { nm.addEventListener('input', updateSugg); updateSugg(); }
}

function codeLinks(m) {
  const l = L(), out = [], g = q => `https://www.google.com/search?q=${encodeURIComponent(q)}`;
  // Koreanische Arzneimittel: offizielle Seite (의약품안전나라) mit Wirkung, Dosierung, Hinweisen.
  // 한국 약: 의약품안전나라 공식 상세 페이지(효능·용법·주의사항).
  if (m.itemSeq) out.push([`https://nedrug.mfds.go.kr/pbp/CCBBB01/getItemDetail?itemSeq=${encodeURIComponent(m.itemSeq)}`, l.findNedrug]);
  if (m.link && /^https?:\/\//i.test(m.link)) out.push([m.link, l.openQr]);
  const lf = m.leaflet || (catOf(m) || {}).leaflet;
  if (lf && /^https?:/i.test(lf)) out.push([lf, l.leafSrc]);
  if (m.pzn) {
    out.push([g('PZN ' + m.pzn), l.findName]);
    out.push([g(`PZN ${m.pzn} Beipackzettel`), l.findLeaflet]);
  } else if (m.itemSeq) {
    // schon oben / 위에서 이미 넣음
  } else if (m.ean && /^880/.test(m.ean)) {
    out.push([`https://search.naver.com/search.naver?query=${encodeURIComponent(m.name ? m.name + ' 복용법' : m.ean)}`, l.findNaver]);
  } else if (m.ean) out.push([g(m.ean), l.findGoogle]);
  else if (m.name) out.push([g(m.name + (S.lang === 'de' ? ' Beipackzettel' : ' 복용법')), l.findGoogle]);
  return out.length ? `<div class="links">${out.map(([u, t]) => `<a href="${esc(u)}" target="_blank" rel="noopener">${ms('open_in_new')}${esc(t)}</a>`).join('')}</div>` : '';
}
function codeInfo(m) {
  const l = L(), bits = [];
  if (m.pzn) bits.push(`PZN <b>${esc(m.pzn)}</b>`);

}

function newDraft(extra = {}) {
  return { id: uid(), name: '', kind: '', use: '', drawer: '', who: '', exp: '', opened: '', openDays: 0, dose: '', doseDavin: '', doseArin: '', note: '', pzn: '', ean: '', code: '', batch: '', serial: '', created: Date.now(), ...extra };

// Ein gelesener Code → bekannte Packung öffnen oder neues Formular (mit Angaben derselben Sorte).
// 읽은 코드 → 이미 있는 같은 통이면 열고, 아니면 새 양식(같은 약을 전에 등록했으면 그 정보를 복사).
function handleCode(c) {
  const l = L();
  const code = MedCode.key(c);
  if (c.serial) {
    const same = Object.values(S.meds).find(m => m.code === code && m.serial === c.serial);
    if (same) { toast(l.sameBox); openDrawerOf(same); openSheet({ type: 'detail', id: same.id }); return; }
  }
  const prev = S.cat[code] || Object.values(S.meds).filter(m => m.code === code).sort((a, b) => (b.updated || 0) - (a.updated || 0))[0];
  const base = prev ? { ...fromCat(prev), copied: true } : {};
  if (base.info && base.info.use) fillKids(base, base.info.use, true);
  ui.draft = newDraft({ ...base, pzn: c.pzn, ean: c.ean, code, batch: c.batch, serial: c.serial, exp: c.exp, expScan: c.exp, ...(c.url ? { link: c.url } : {}) });
  ui.customDays = false;
  ui.krNote = !c.pzn && !c.ean && c.url ? { t: l.qrSaved } : null;
  openSheet({ type: 'form' });
  if (prev) toast(l.copied);
  if (/^880/.test(c.ean) && !(prev && prev.itemSeq && prev.info)) fillKorean(ui.draft.id, c.ean);
  if (c.pzn && canFetch()) {
    if (!(prev && prev.info)) autoGerman(ui.draft.id, c.pzn);
    else if (!prev.img) photoIntoDraft(ui.draft.id, () => photoFromUrl(dePhotoUrl(c.pzn)));
  }
}

// 1) Barcode → Name/Firma/품목기준코드 aus kd/NNN.json (HIRA-Liste, im App-Ordner, kein Schlüssel nötig).

async function viaWorker(url) {

  if (!r.ok) { let e = {}; try { e = await r.json(); } catch (x) {} throw new Error(e.error === 'upstream' ? 'blocked' : (e.error || 'http' + r.status)); }

// Text aus einem PDF (nur Text-PDFs; eingescannte Bilder haben keinen Text). / PDF에서 글자 꺼내기(글자가 든 PDF만).
async function pdfText(buf) {
  const lib = await pdfjs(), doc = await lib.getDocument({ data: new Uint8Array(buf) }).promise;
  let out = '', rows = '';
  for (let p = 1; p <= Math.min(doc.numPages, 40); p++) {
    const tc = await (await doc.getPage(p)).getTextContent();
    let line = '';

      if (it.hasEOL) { out += line + '\n'; line = ''; }
    }
    out += line + '\n';
    // Zusätzlich zeilenweise nach Höhe auf der Seite: Tabellen stehen im PDF oft Spalte für Spalte.
    // 높이(y)로 다시 묶은 줄: PDF 표는 칸별로 저장된 경우가 많아서 가로줄을 다시 맞춤.
    const byY = new Map();
    for (const it of tc.items) {
      if (!it.str || !it.str.trim()) continue;
      const y = Math.round(it.transform[5] / 3);
      if (!byY.has(y)) byY.set(y, []);
      byY.get(y).push(it);
    }
    // Zellen trennen, wo zwischen zwei Textstücken eine Lücke ist; jede Zelle als „x@Text“, getrennt mit Tab.
    // 글자 사이가 벌어진 곳에서 칸을 나눔. 칸마다 'x위치@글', 탭으로 구분.
    rows += [...byY.entries()].sort((a, b) => b[0] - a[0]).map(([, its]) => {
      its.sort((a, b) => a.transform[4] - b.transform[4]);
      const cells = [];
      let end = -1e9;
      for (const i of its) {
        const x = i.transform[4];
        if (!cells.length || x - end > 6) cells.push({ x, s: i.str.trim() });
        else cells[cells.length - 1].s += ' ' + i.str.trim();
        end = x + (i.width || 0);
      }
      return cells.map(c => `${Math.round(c.x)}@${c.s}`).join('\t');

}
// Lesbarer Text aus HTML, Tabellenzellen mit „|“. / HTML에서 글만, 표 칸은 | 로.
function htmlText(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  doc.querySelectorAll('script,style,noscript,svg,nav,header,footer,form,iframe,button').forEach(e => e.remove());
  doc.querySelectorAll('br').forEach(e => e.replaceWith('\n'));

  doc.querySelectorAll('tr').forEach(tr => tr.replaceWith([...tr.children].map(c => c.textContent.replace(/\s+/g, ' ').trim()).join(' | ') + '\n'));
  doc.querySelectorAll('p,div,li,h1,h2,h3,h4,h5,h6,section,article,dt,dd,table,caption').forEach(e => e.append('\n'));

  if (!m.drawer) m.drawer = guessDrawer(`${m.use || ''} ${m.name}`);
  m.openDays = +m.openDays || 0;
  // Angebrochen ohne Frist: aus dem Beipackzettel nehmen / 개봉했는데 기간이 비었으면 설명서에서
  let autoOpen = 0;
  if (m.opened && !m.openDays) { autoOpen = openDaysFromInfo(m); if (autoOpen) m.openDays = autoOpen; }
  if (!m.code) m.code = m.pzn ? 'pzn:' + m.pzn : m.ean ? 'ean:' + m.ean : '';
  stockFromForm(m);
  if (!m.box) m.box = boxesList()[0].id;
  // Behandlungsdauer aus den Formularfeldern / 처방 기간 칸
  if (+m.courseDays > 0) m.course = { start: m.courseStart || today(), days: +m.courseDays, perDay: +m.coursePer || 0 };
  else delete m.course;
  delete m.courseStart; delete m.courseDays; delete m.coursePer;
  // Wirkstoffe für die Warnung bei gleichem Wirkstoff / 같은 성분 경고용 성분
  const ci = m.info || (catOf(m) || {}).info || {};
  m.ingr = MedLeaflet.ingredients([m.name, ci.ingr, (ci.use || '').slice(0, 800)], m.atc || (catOf(m) || {}).atc);
  if (!m.ingr.length) delete m.ingr;
  for (const k of Object.keys(m)) if (m[k] === '' || m[k] == null) delete m[k];
  // Sorten-Angaben ins Lexikon; die lange Beschreibung liegt nur dort. / 제품 정보는 사전에, 긴 설명은 사전에만.
  toCat(m);
  // Foto zur Sorte / 제품 사진
  const ce = S.cat[catKey(m)];
  if (ce && photo === '') { ce.img = 0; dropPhoto(imgKey(m)); }
  else if (ce && photo && photoNew) { ce.img = Date.now(); storePhoto(imgKey(m), photo); }
  delete m.info;
  commit(m);
  openDrawerOf(m);
  toast(autoOpen ? l.openAuto(openLabel(autoOpen)) : l.saved);
  openSheet({ type: 'detail', id: m.id });
  ui.draft = null;
}

// ---------- Krankheitstagebuch: Fieber und Gaben / 아플 때 기록: 체온과 먹은 약 ----------
// S.log = { id → { t: Zeitpunkt (ms), who: davin|arin|mom|dad, kind: temp|dose, temp, med, name, amt, note } }
// Die Familie teilt es (households/{Code}_medlog). Einträge älter als 60 Tage werden beim Öffnen gelöscht.
// S.log = { id → 기록 }. 가족이 함께 씀(households/{코드}_medlog). 60일 지난 기록은 열 때 지움.
S.log = S.log || {};
const PEOPLE = ['davin', 'arin', 'mom', 'dad'];
const pName = w => L().people[w] || w;
(() => { const old = Date.now() - 60 * 864e5; for (const id in S.log) if (!(S.log[id].t > old)) delete S.log[id]; })();
const logs = (who, since = 0) => Object.values(S.log).filter(x => (!who || x.who === who) && x.t >= since).sort((a, b) => b.t - a.t);
const hhmm = t => { const d = new Date(t); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const dayOf = t => { const d = new Date(t); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
function ago(t) {
  const mins = Math.round((Date.now() - t) / 60000), l = L();
  return mins < 1 ? l.justNow : mins < 60 ? l.minAgo(mins) : mins < 1440 ? l.hAgo(Math.floor(mins / 60)) : l.dAgo(Math.floor(mins / 1440));
}
function whenText(t) {
  const d = dayOf(t);
  return d === today() ? hhmm(t) : d === addDays(today(), 1) ? `${L().tomorrow} ${hhmm(t)}` : `${fmtShort(d)} ${hhmm(t)}`;
}
const tempCls = c => c >= 39 ? 'bad' : c >= 38 ? 'soon' : c >= 37.5 ? 'warm' : 'ok';
const doseFor = (m, who) => who === 'davin' ? m.doseDavin : who === 'arin' ? m.doseArin : '';
// Abstand und Höchstzahl: zuerst aus der Kinderdosis, dann „먹는 법“, dann Beipackzettel.
// 간격·하루 최대: 아이 용량 → 먹는 법 → 설명서 순서로 찾음.
function schedFor(m, who) {
  const info = (catOf(m) || {}).info || m.info || {};
  let minHours = 0, maxPerDay = 0;
  for (const src of [doseFor(m, who), m.dose, info.use]) {
    const s = MedLeaflet.schedule(src || '');
    if (!minHours && s.minHours) minHours = s.minHours;
    if (!maxPerDay && s.maxPerDay) maxPerDay = s.maxPerDay;
  }
  return { minHours, maxPerDay };
}
// Stand für eine Person und ein Mittel zu einem Zeitpunkt / 한 사람·한 약의 지금 상태
function doseState(m, who, at = Date.now()) {
  const { minHours, maxPerDay } = schedFor(m, who);
  const mine = logs(who, at - 864e5).filter(x => x.kind === 'dose' && x.med === m.id && x.t <= at);
  const gap = minHours || (maxPerDay ? Math.floor(24 / maxPerDay) : 0);
  const last = mine[0], next = last && gap ? last.t + gap * 36e5 : 0;
  return { last, count: mine.length, minHours, maxPerDay, gap, next, early: next > at, full: !!maxPerDay && mine.length >= maxPerDay };
}
// Wirkstoffe eines Mittels (Lexikon, sonst aus Name/ATC) / 약의 성분(사전, 없으면 이름·ATC로)
const ingrOf = m => {
  const e = catOf(m) || {}, i = e.info || m.info || {};
  return (e.ingr && e.ingr.length ? e.ingr : m.ingr && m.ingr.length ? m.ingr : MedLeaflet.ingredients([m.name, i.ingr], e.atc || m.atc));
};
// Andere Sorten im Schrank mit gleichem Wirkstoff / 같은 성분이 든 다른 약
function sameIngr(m) {
  const mine = ingrOf(m);
  if (!mine.length) return [];
  return active().filter(x => x.id !== m.id && groupKey(x) !== groupKey(m))
    .map(x => ({ m: x, k: ingrOf(x).filter(k => mine.includes(k)) })).filter(x => x.k.length);
}
// Gleicher Wirkstoff kürzlich aus einem anderen Mittel gegeben? / 최근 다른 약으로 같은 성분을 먹었나?
function ingrClash(m, who, at = Date.now()) {
  const mine = ingrOf(m);
  if (!mine.length) return null;
  const hours = Math.max(4, schedFor(m, who).minHours || 6);
  for (const x of logs(who, at - hours * 36e5)) {
    if (x.kind !== 'dose' || x.med === m.id || x.t > at) continue;
    const o = S.meds[x.med], k = (o ? ingrOf(o) : MedLeaflet.ingredients([x.name])).filter(i => mine.includes(i));
    if (k.length) return { log: x, k };
  }
  return null;
}
const ingrNames = ks => ks.map(k => MedLeaflet.ingrName(k, S.lang)).join(', ');

// Behandlungsdauer, z. B. Antibiotikum 7 Tage × 2 / 처방 복용 기간(예: 항생제 7일 × 하루 2번)
function courseState(m) {
  const c = m.course;
  if (!c || !c.start || !c.days) return null;
  const day = diff(c.start, today()) + 1, end = addDays(c.start, c.days - 1);
  const doses = Object.values(S.log).filter(x => x.kind === 'dose' && x.med === m.id && dayOf(x.t) >= c.start);
  const todayN = doses.filter(x => dayOf(x.t) === today()).length;
  return { day, days: c.days, perDay: c.perDay || 0, todayN, total: doses.length, end, active: day >= 1 && today() <= end };
}
const courseWho = m => ['davin', 'arin'].includes(m.who) ? m.who : '';

// Startseite: Karten für Kranke (letzte 48 h) und laufende Behandlungen / 첫 화면: 아픈 사람 카드, 복용 중인 약
function careHtml() {
  const l = L(), since = Date.now() - 48 * 36e5;
  const cards = PEOPLE.filter(w => logs(w, since).length).map(w => {
    const ls = logs(w, since), t = ls.find(x => x.kind === 'temp');
    const meds = [...new Set(ls.filter(x => x.kind === 'dose').map(x => x.med))].map(id => S.meds[id]).filter(Boolean);
    const rows = meds.map(m => {
      const s = doseState(m, w), lastT = (s.last || ls.find(x => x.kind === 'dose' && x.med === m.id)).t;
      const nx = s.full ? `<span class="nx bad">${esc(l.maxReached(s.count, s.maxPerDay))}</span>`
        : s.early ? `<span class="nx soon">${esc(l.nextAt(whenText(s.next)))}</span>` : s.gap ? `<span class="nx ok">${esc(l.canNow)}</span>` : '';
      return `<button class="crow" data-act="addlog" data-who="${w}" data-med="${m.id}"><span class="cn">${esc(m.name)}<small>${esc(l.lastAt(hhmm(lastT)))}${s.maxPerDay ? ` · ${esc(l.in24(s.count, s.maxPerDay))}` : ''}</small></span>${nx}</button>`;
    }).join('');
    return `<div class="care p-${w}"><div class="ch"><b>${esc(pName(w))}</b>
      ${t ? `<span class="tp ${tempCls(t.temp)}">${t.temp.toFixed(1)}℃</span><small>${esc(ago(t.t))}</small>` : ''}
      <button class="mini2" data-act="loglist" data-who="${w}" aria-label="${esc(l.diary)}">${ms('history')}</button></div>
      ${rows}
      <div class="cb"><button data-act="addlog" data-who="${w}" data-kind="temp">${ms('thermometer')}${esc(l.addTemp)}</button><button data-act="addlog" data-who="${w}" data-kind="dose">${ms('pill')}${esc(l.addDose)}</button></div></div>`;
  }).join('');
  const courses = active().map(m => [m, courseState(m)]).filter(([, c]) => c && c.active);
  const courseCard = !courses.length ? '' : `<div class="care course"><div class="ch">${ms('event')}<b>${esc(l.courseNow)}</b></div>${courses.map(([m, c]) =>
    `<button class="crow" data-act="addlog" data-who="${courseWho(m)}" data-med="${m.id}"><span class="cn">${esc(m.name)} ${whoChip(m.who)}<small>${esc(l.courseDay(c.day, c.days))}</small></span>${c.perDay ? `<span class="nx ${c.todayN >= c.perDay ? 'ok' : 'soon'}">${esc(l.todayN(c.todayN, c.perDay))}</span>` : ''}</button>`).join('')}</div>`;
  return cards + courseCard;
}

// Neuer Eintrag / 새 기록
const amtFor = (m, who) => !m ? '' : (MedLeaflet.amountOf(doseFor(m, who) || '') || MedLeaflet.amountOf(m.dose || '') || '');
function openAddLog(o = {}) {
  const recent = PEOPLE.find(w => logs(w, Date.now() - 48 * 36e5).length);
  const who = o.who || (o.med && courseWho(S.meds[o.med] || {})) || recent || 'davin';
  const last = logs(who).find(x => x.kind === 'temp');
  ui.logDraft = { who, kind: o.kind || (o.med ? 'dose' : 'temp'), temp: last ? last.temp : 38, med: o.med || '', amt: '', date: today(), time: hhmm(Date.now()), note: '' };
  if (ui.logDraft.med) ui.logDraft.amt = amtFor(S.meds[ui.logDraft.med], who);
  openSheet({ type: 'addlog' });
}
function logAt(d) {
  const [h, mi] = String(d.time || '00:00').split(':'), x = new Date(`${d.date || today()}T00:00:00`);
  x.setHours(+h || 0, +mi || 0, 0, 0);
  return x.getTime();
}
function readLog() {
  const d = ui.logDraft, g = id => document.getElementById(id);

}
function addlogHtml() {
  const l = L(), d = ui.logDraft;
  const ppl = PEOPLE.map(w => `<button type="button" class="chip p-${w} ${d.who === w ? 'on' : ''}" data-act="lset" data-k="who" data-v="${w}">${esc(pName(w))}</button>`).join('');
  const seg = `<div class="seg"><button type="button" class="${d.kind === 'temp' ? 'on' : ''}" data-act="lset" data-k="kind" data-v="temp">${ms('thermometer')}${esc(l.tTemp)}</button><button type="button" class="${d.kind === 'dose' ? 'on' : ''}" data-act="lset" data-k="kind" data-v="dose">${ms('pill')}${esc(l.tDose)}</button></div>`;
  let body;
  if (d.kind === 'temp') {
    body = `<div class="tbig"><button type="button" class="tb" data-act="tstep" data-v="-0.1">−</button><span class="tv ${tempCls(+d.temp)}">${(+d.temp).toFixed(1)}<small>℃</small></span><button type="button" class="tb" data-act="tstep" data-v="0.1">+</button></div>
      <div class="wrapchips" style="justify-content:center">${[36.5, 37, 37.5, 38, 38.5, 39, 39.5, 40].map(v => `<button type="button" class="chip ${+d.temp === v ? 'on' : ''}" data-act="lset" data-k="temp" data-v="${v}">${v.toFixed(1)}</button>`).join('')}</div>`;
  } else {

    const lastUse = id => (logs(d.who).find(x => x.med === id) || {}).t || 0;
    const old = x => statusOf(x).st === 'bad';
    const seen = new Set(S.meds[d.med] ? [groupKey(S.meds[d.med])] : []);
    const list = active().filter(fits).sort((a, b) => old(a) - old(b) || lastUse(b.id) - lastUse(a.id) || !!b.opened - !!a.opened || String(a.name).localeCompare(String(b.name)) || byLimit(a, b))
      .filter(x => x.id === d.med || !seen.has(groupKey(x)) && !!seen.add(groupKey(x)));
    const m = S.meds[d.med], warn = [];
    if (m && old(m)) warn.push(l.wExpired);

      ${warn.map(w => `<p class="lwarn">${ms('warning')} ${esc(w)}</p>`).join('')}`;
  }
  return `<div class="sbar"><button class="txtbtn l" data-act="close">${esc(l.cancel)}</button><h2>${esc(l.newLog)}</h2><button class="txtbtn r" data-act="savelog">${esc(l.save)}</button></div>

    <label class="f">${esc(l.fNote)}</label><input class="in" id="lnote" value="${esc(d.note)}" placeholder="${esc(l.logNotePh)}"></div>`;
}
// Verlauf einer Person mit Fieberkurve (72 h) / 한 사람의 기록과 체온 그래프(72시간)
function tempChart(ts) {
  const W = 320, H = 124, t0 = ts[0].t, t1 = Math.max(ts[ts.length - 1].t, t0 + 36e5), lo = 36, hi = 40.5;
  const x = t => 28 + (t - t0) / (t1 - t0) * (W - 38), y = c => 8 + (hi - Math.min(hi, Math.max(lo, c))) / (hi - lo) * (H - 28);
  const guide = c => `<line x1="28" x2="${W - 8}" y1="${y(c).toFixed(1)}" y2="${y(c).toFixed(1)}" class="g${c >= 38.5 ? ' hot' : ''}"/><text x="2" y="${(y(c) + 4).toFixed(1)}">${c.toFixed(1)}</text>`;
  return `<svg class="tchart" viewBox="0 0 ${W} ${H}">${guide(37)}${guide(38.5)}${guide(40)}<polyline points="${ts.map(p => `${x(p.t).toFixed(1)},${y(p.temp).toFixed(1)}`).join(' ')}"/>${ts.map(p => `<circle cx="${x(p.t).toFixed(1)}" cy="${y(p.temp).toFixed(1)}" r="3.5" class="${tempCls(p.temp)}"/>`).join('')}<text x="28" y="${H - 2}">${esc(whenText(t0))}</text><text x="${W - 8}" y="${H - 2}" text-anchor="end">${esc(whenText(ts[ts.length - 1].t))}</text></svg>`;
}
function loglistHtml() {
  const l = L(), w = ui.logWho || PEOPLE.find(p => logs(p).length) || 'davin', ls = logs(w);
  const tabs = PEOPLE.map(p => `<button class="chip p-${p} ${p === w ? 'on' : ''}" data-act="loglist" data-who="${p}">${esc(pName(p))}</button>`).join('');

  const rows = ls.slice(0, 150).map(x => {

    lastDay = d;

  }).join('');
  return `<div class="sbar"><span style="min-width:56px"></span><h2>${esc(l.diary)}</h2><button class="txtbtn r" data-act="close">${esc(l.close)}</button></div>

}
// Detailansicht: Wirkstoff-Warnung, Behandlungsdauer, „genommen“-Knopf / 상세: 같은 성분 경고, 처방 기간, 먹었어요
function detailCare(m) {
  const l = L(), out = [], si = sameIngr(m), c = courseState(m);

  else if (ingrOf(m).length) out.push(`<p class="note" style="margin:0 0 10px">${esc(l.ingrIs(ingrNames(ingrOf(m))))}</p>`);
  if (c) out.push(`<div class="box"><h3>${ms('event')}${esc(l.courseTitle)}</h3><p style="margin:0">${esc(c.active ? l.courseDay(c.day, c.days) : c.day < 1 ? l.courseFrom(fmt(m.course.start)) : l.courseDone)}${c.perDay && c.active ? ` · ${esc(l.todayN(c.todayN, c.perDay))}` : ''}</p><p class="note" style="margin:4px 0 0">${esc(l.courseEnd(fmt(c.end)))}${c.perDay ? ` · ${esc(l.courseTotal(c.total, c.days * c.perDay))}` : ''}</p></div>`);
  return out.join('');
}

// ---------- Mehrere Aufbewahrungsorte / 약상자 여러 개 ----------
// Liste im Familien-Lexikon unter „@boxes“ ({ list: [{ id, name }] }); jede Packung hat m.box.
// Ohne eigene Liste gibt es nur einen Ort. / 사전의 '@boxes'에 목록, 약마다 m.box. 목록이 없으면 하나뿐.
const boxesList = () => { const b = S.cat['@boxes']; return b && b.list && b.list.length ? b.list : [{ id: 'home', name: '' }]; };
const boxName = id => { const b = boxesList().find(x => x.id === id) || boxesList()[0]; return b.name || L().boxDefault; };
const boxOf = m => boxesList().some(b => b.id === m.box) ? m.box : boxesList()[0].id;
const multiBox = () => boxesList().length > 1;
const boxMatch = m => !multiBox() || !ui.box || ui.box === 'all' || boxOf(m) === ui.box;

// ---------- Vorrat / 재고 ----------
// Summe mehrerer Packungen, wenn alle gezählt und in derselben Einheit / 여러 통 합계(모두 같은 단위로 셀 때)
function packSum(ms) {
  const u = ms[0].qty && ms[0].qty.unit;
  if (!u || !ms.every(m => m.qty && m.qty.unit === u && m.qty.total > 0)) return '';
  return L().sumLeft(fmtNum(ms.reduce((a, m) => a + m.qty.left, 0)) + ' ' + L().units[u]);
}
// m.qty = { unit: tab|pc|bag|ml, total, left } (gezählt) oder m.level 3 voll · 2 halb · 1 wenig · 0 fast leer.
// m.qty = { 단위, 한 통 양, 남은 양 }(셈) 또는 m.level 3 가득 · 2 절반 · 1 조금 · 0 거의 없음.
const COUNT_UNITS = ['tab', 'pc', 'bag', 'ml'];
const unitDefault = k => k === 'tab' ? 'tab' : k === 'supp' ? 'pc' : k === 'syrup' ? 'ml' : 'level';
const unitOf = m => m.qty && m.qty.unit ? m.qty.unit : m.level != null ? 'level' : '';
const fmtNum = n => String(Math.round(n * 10) / 10).replace('.', S.lang === 'de' ? ',' : '.');
// Packungsgröße unbekannt (Schachtel weg): nur den Rest zählen, Maßstab = höchster gezählter Stand
// 상자를 버려 한 통 양을 모르면 남은 양만 셈. 기준은 지금까지 센 가장 많은 양
function qtyFrom(u, total, left, prev) {
  const T = +total > 0 ? +total : 0, n = left === '' || left == null ? null : +left, same = prev && prev.unit === u;
  if (T) return { unit: u, total: T, left: Math.max(0, Math.min(T, n == null ? (same ? prev.left : T) : n)) };
  if (n != null && n > 0) return { unit: u, total: Math.max(n, same && prev.loose ? prev.total : 0), left: n, loose: true };
  return null;
}
function stockRatio(m) {
  if (m.qty && m.qty.total > 0) return Math.max(0, Math.min(1, m.qty.left / m.qty.total));
  if (m.level != null) return m.opened ? [0.05, 0.25, 0.5, 1][m.level] ?? 1 : 1;
  return null;
}
// Alle Packungen derselben Sorte knapp? (eine volle Reservepackung = nicht knapp) / 같은 약 모든 통이 부족할 때만
const lowToShop = list => { const seen = new Set(); return list.filter(m => groupLow(m) && !m.shopped && !seen.has(groupKey(m)) && !!seen.add(groupKey(m))); };
const groupLow = m => lowStock(m) && active().filter(x => groupKey(x) === groupKey(m)).every(lowStock);
const lowStock = m => m.level != null ? !!m.opened && m.level <= 1 : (m.qty && m.qty.total > 0 ? m.qty.left / m.qty.total <= 0.25 : false);
function stockText(m) {
  const l = L();
  if (m.qty && m.qty.loose) return l.looseLeft(`${fmtNum(m.qty.left)} ${l.units[m.qty.unit]}`);
  if (!m.opened && ((m.qty && m.qty.total > 0 && m.qty.left >= m.qty.total) || m.level != null)) return l.unopened;
  if (m.qty && m.qty.total > 0) return `${fmtNum(m.qty.left)}/${fmtNum(m.qty.total)} ${l.units[m.qty.unit]}`;
  if (m.level != null) return l.levels[m.level];
  return '';
}
const stockBar = m => { const r = stockRatio(m); return r == null ? '' : `<span class="sbar2 ${r <= 0.25 ? 'low' : ''}"><i style="width:${Math.round(r * 100)}%"></i></span>`; };
// Menge aus „7,5 ml“, „1–2 Tabletten“ in der Einheit des Vorrats, sonst 0 / 먹은 양 글 → 재고 단위 숫자(안 맞으면 0)
function amountIn(text, unit) {
  const m = MedLeaflet.fractions(text).match(/(\d+(?:[.,]\d+)?)(?:\s*[-–~]\s*\d+(?:[.,]\d+)?)?\s*(ml|mL|Milliliter|Filmtabletten?|Tabletten?|Kapseln?|정|캡슐|Beutel|포|Zäpfchen|좌제|Stück|개)/i);
  if (!m) return 0;
  const u = /ml|milliliter/i.test(m[2]) ? 'ml' : /tablet|kapsel|정|캡슐/i.test(m[2]) ? 'tab' : /beutel|포/i.test(m[2]) ? 'bag' : 'pc';
  return u === unit ? parseFloat(m[1].replace(',', '.')) : 0;
}
// Detailansicht: Balken, ± und „auf die Einkaufsliste“ / 상세: 막대, ±, 장보기

}
// Formular: Einheit, Menge pro Packung, Rest – oder grob / 양식: 단위, 한 통 양, 남은 양 또는 대충
function stockFormHtml(m) {
  const l = L();
  const u = m.qtyUnit != null ? m.qtyUnit : m.qty ? m.qty.unit : m.level != null ? 'level' : unitDefault(m.kind);

        <div class="wrapchips" style="flex:0 0 100%">${(u === 'ml' ? [50, 100, 150, 200] : [10, 20, 30, 50, 100]).map(n => `<button type="button" class="chip ${+total === n ? 'on' : ''}" data-act="set" data-k="qtyTotal" data-v="${n}">${n} ${esc(l.units[u])}</button>`).join('')}</div>
        <div><label class="f">${esc(l.qtyLeft)}</label><div class="inrow"><input class="in" type="number" inputmode="decimal" min="0" step="any" name="qtyLeft" value="${esc(left)}" placeholder="${esc(l.qtyLeftPh)}"><span>${esc(l.units[u])}</span></div></div></div>` : '';

    <p class="hint">${esc(u === 'level' ? l.stockHintLevel : u ? l.stockHint : l.stockHintNone)}</p></div>`;

// Formularwerte → m.qty / m.level / 양식 값 → 재고
function stockFromForm(m) {
  const u = m.qtyUnit != null ? m.qtyUnit : m.qty ? m.qty.unit : m.level != null ? 'level' : unitDefault(m.kind);
  const q = COUNT_UNITS.includes(u) ? qtyFrom(u, m.qtyTotal, m.qtyLeft, m.qty) : null;
  if (q) {
    m.qty = q;
    delete m.level;
  } else if (u === 'level') {
    m.level = m.level != null && m.level !== '' ? +m.level : 3;
    if (m.level < 3 && !m.opened) m.opened = today();
    delete m.qty;
  } else if (!u) { delete m.qty; delete m.level; }
  delete m.qtyUnit; delete m.qtyTotal; delete m.qtyLeft;
}

// ---------- Fotos der Packungen / 약 사진 ----------
// Je Sorte ein kleines JPEG (längste Seite 360 px, ~30 KB). Gespeichert im Cache „meds-img“ des Geräts und – angemeldet –
// in einem eigenen Familien-Dokument households/{Code}_img_{Schlüssel}. Im Lexikon steht nur e.img = Zeitstempel.
// 제품마다 작은 JPEG 한 장(긴 쪽 360px, 약 30KB). 기기의 'meds-img' 저장소와(로그인 시) 가족 문서
// households/{코드}_img_{열쇠}에 저장. 사전에는 e.img = 시간만 적어서 다른 휴대폰도 사진이 있는 걸 앎.
const imgKey = m => hashId(catKey(m) || m.name || '');
const imgMem = new Map(), imgLoading = new Set();
async function imgCache() { try { return await caches.open('meds-img'); } catch (e) { return null; } }
async function storePhoto(k, data) {
  imgMem.set(k, data);
  const c = await imgCache();
  if (c) await c.put('img/' + k, new Response(data)).catch(() => {});
  if (canFetch() && window.cloud.putImg) await window.cloud.putImg(k, data).catch(e => console.warn('img', e));
}
async function dropPhoto(k) {
  imgMem.delete(k);
  const c = await imgCache();
  if (c) await c.delete('img/' + k).catch(() => {});
}
// Foto einer Packung (oder null); lädt im Hintergrund nach und zeichnet dann neu. / 사진(없으면 null). 없으면 뒤에서 불러와 다시 그림.
function photoOf(m) {
  const e = catOf(m);
  if (!e || !e.img) return null;
  const k = imgKey(m);
  if (imgMem.has(k)) return imgMem.get(k);
  if (!imgLoading.has(k)) {
    imgLoading.add(k);
    (async () => {
      let data = null;
      const c = await imgCache(), r = c && await c.match('img/' + k);
      if (r) data = await r.text();
      if (!data && canFetch() && window.cloud.getImg) {
        data = await window.cloud.getImg(k).catch(() => null);
        if (data && c) await c.put('img/' + k, new Response(data)).catch(() => {});
      }
      if (data) { imgMem.set(k, data); render(); if (ui.sheet && ui.sheet.type === 'detail') renderSheet(); }
    })().finally(() => setTimeout(() => imgLoading.delete(k), 60000));
  }
  return null;
}
// Bild verkleinern → JPEG-Daten-URL / 사진 줄이기
async function shrink(src, max = 360) {
  const bmp = await createImageBitmap(src instanceof Blob ? src : await (await fetch(src)).blob());
  const k = Math.min(1, max / Math.max(bmp.width, bmp.height)), c = document.createElement('canvas');
  c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  const x = c.getContext('2d');
  x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
  x.drawImage(bmp, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.78);
}
// Foto aus dem Netz über den Abruf-Server / 인터넷 사진을 가져오기 서버로
async function photoFromUrl(url) {
  const r = await viaWorker(url), type = r.headers.get('Content-Type') || '';
  if (!/^image\//i.test(type) && !(/octet-stream/i.test(type) && /\.(jpe?g|png|webp)(\?|$)/i.test(url))) return null;
  return shrink(await r.blob());
}
// Koreanisch: Packungsfoto von 의약품안전나라 (steht als Bild in der Detailseite) / 의약품안전나라 포장 사진
async function nedrugPhoto(seq) {
  const r = await viaWorker(`https://nedrug.mfds.go.kr/pbp/CCBBB01/getItemDetail?itemSeq=${encodeURIComponent(seq)}`);
  const html = await r.text();
  const m = html.match(/<img[^>]*src="(data:image\/(?:jpeg|png);base64,[A-Za-z0-9+/=]+)"[^>]*alt="[^"]*(?:포장|용기|제품)[^"]*"/) || html.match(/<img[^>]*alt="[^"]*(?:포장|용기|제품)[^"]*"[^>]*src="(data:image\/(?:jpeg|png);base64,[A-Za-z0-9+/=]+)"/);
  return m ? shrink(m[1]) : null;
}
// Ins Formular übernehmen, wenn dort noch kein Foto ist / 양식에 사진이 없을 때만 넣음

// ---------- Deutsche Mittel über die PZN / 독일 약: PZN으로 사진·설명서 ----------
// Die Online-Apotheke shop-apotheke legt Produktfoto und Beipackzettel-PDF unter festen Adressen ab:
// …/images/D01/234/562/D01234562-p1.jpg und …/PDF/D01/234/562/D01234562-bp.pdf. Nicht jede PZN hat beides.
// 독일 온라인 약국 shop-apotheke는 PZN으로 정해진 주소에 제품 사진과 설명서 PDF를 둠(없는 PZN도 있음).
const saPath = p => `D${p.slice(0, 2)}/${p.slice(2, 5)}/${p.slice(5, 8)}/D${p}`;
const dePhotoUrl = p => `https://cdn.shop-apotheke.com/images/${saPath(p)}-p1.jpg`;
const deLeafletUrl = p => `https://cdn.shop-apotheke.com/PDF/${saPath(p)}-bp.pdf`;
async function leafletByPzn(pzn) {
  const r = await viaWorker(deLeafletUrl(pzn));
  return MedLeaflet.parse(await pdfText(await r.arrayBuffer()));
}
// Produktbilder einer Seite: JSON-LD „Product.image“, og:image (ohne Logos/SVG), itemprop=image
// 페이지의 제품 사진 후보: JSON-LD, og:image(로고·SVG 제외), itemprop=image
function pageImages(html, base) {
  const doc = new DOMParser().parseFromString(html, 'text/html'), out = [];
  const walk = o => {
    if (!o || typeof o !== 'object') return;
    if (Array.isArray(o)) return o.forEach(walk);
    if (/Product|Drug|Medic/i.test([].concat(o['@type'] || []).join(' ')) && o.image) [].concat(o.image).forEach(i => out.push(typeof i === 'string' ? i : i && i.url));
    if (o['@graph']) walk(o['@graph']);
  };
  doc.querySelectorAll('script[type="application/ld+json"]').forEach(s => { try { walk(JSON.parse(s.textContent)); } catch (e) {} });
  doc.querySelectorAll('meta[property="og:image"],meta[name="og:image"],meta[name="twitter:image"],link[rel="image_src"],img[itemprop="image"]')
    .forEach(e => out.push(e.getAttribute('content') || e.getAttribute('href') || e.getAttribute('src')));
  // PZN in der Adresse oder auf der Seite → Foto der Online-Apotheke / 주소나 페이지의 PZN → 온라인 약국 사진
  const pz = (String(base).match(/\/(\d{8})(?:\/|$|\?)/) || html.match(/PZN[^0-9]{0,20}(\d{8})/i) || [])[1];
  if (pz && MedCode.pznOk(pz)) out.push(dePhotoUrl(pz));
  return [...new Set(out.filter(Boolean).map(u => { try { return new URL(u, base).href; } catch (e) { return ''; } })
    .filter(u => /^https:/.test(u) && !/\.svg(\?|$)|logo|favicon|placeholder/i.test(u)))].slice(0, 4);
}
// Erst direkt (viele Bildserver erlauben das), sonst über den Abruf-Server; Seitenlink → Produktbild der Seite
// 먼저 직접 받아 보고(되는 서버가 많음), 안 되면 가져오기 서버로. 페이지 주소면 그 페이지의 제품 사진
async function photoFromAny(raw) {
  const url = String(raw || '').trim();
  if (/^data:image\//i.test(url)) return shrink(url);
  if (!/^https?:\/\//i.test(url)) throw new Error('bad');
  try {
    const r = await fetch(url, { mode: 'cors' });
    if (r.ok && /^image\//i.test(r.headers.get('Content-Type') || '')) return await shrink(await r.blob());
  } catch (e) {}
  if (!canFetch()) throw new Error('login');
  const r = await viaWorker(url), type = r.headers.get('Content-Type') || '';
  if (/^image\//i.test(type) || /\.(jpe?g|png|webp|avif)(\?|$)/i.test(url)) return shrink(await r.blob());
  if (/html/i.test(type)) return firstPhoto(pageImages(await r.text(), r.headers.get('X-Final-Url') || url));
  return null;
}
async function firstPhoto(urls) {
  for (const u of urls) { const d = await photoFromUrl(u).catch(() => null); if (d) return d; }
  return null;
}
// Foto zu einer Sorte suchen: koreanisch → 의약품안전나라, PZN → Online-Apotheke, sonst Produktseite
// 제품 사진 찾기: 한국 → 의약품안전나라, PZN → 온라인 약국, 그 밖 → 넣어 둔 제품 페이지
async function findPhoto(m) {
  if (m.itemSeq) { const d = await nedrugPhoto(m.itemSeq).catch(() => null); if (d) return d; }
  if (m.pzn) { const d = await photoFromUrl(dePhotoUrl(m.pzn)).catch(() => null); if (d) return d; }
  if (m.leaflet && !/\.pdf(\?|$)/i.test(m.leaflet)) {
    const r = await viaWorker(m.leaflet).catch(() => null);
    if (r && !/pdf/i.test(r.headers.get('Content-Type') || '')) return firstPhoto(pageImages(await r.text(), r.headers.get('X-Final-Url') || m.leaflet));
  }
  return null;
}
// Beim Scannen einer deutschen Packung: Beipackzettel und Foto automatisch / 독일 약 스캔: 설명서·사진 자동
async function autoGerman(id, pzn) {
  const l = L();
  photoIntoDraft(id, () => photoFromUrl(dePhotoUrl(pzn)));
  readForm(); ui.leafNote = { t: l.leafBusy }; renderSheet();
  let p = null;
  try { p = await leafletByPzn(pzn); } catch (e) { console.warn(e); }
  if (!ui.draft || ui.draft.id !== id) return;
  if (p) return applyLeaflet(p, deLeafletUrl(pzn));
  readForm(); ui.leafNote = { t: l.autoNone }; renderSheet();
}

// Alles nachholen: fehlende Fotos und Beschreibungen für gespeicherte Mittel (füllt nur leere Felder)
// 저장된 약에 빠진 사진·설명을 한 번에 찾기(빈 칸만 채움)
async function fillMissing() {
  const l = L();
  if (!canFetch()) { toast(l.leafLogin); return; }
  const seen = new Set(), list = [];
  for (const m of active()) { const k = catKey(m); if (k && !seen.has(k)) { seen.add(k); list.push(m); } }
  let photos = 0, infos = 0, i = 0;
  for (const m of list) {
    ui.bulk = l.bulkProgress(++i, list.length); if (ui.sheet && ui.sheet.type === 'settings') renderSheet();
    const e = catOf(m) || toCat(m), all = { ...e, ...m };
    if (!e.img) {
      const d = await findPhoto(all).catch(() => null);
      if (d) { e.img = Date.now(); await storePhoto(imgKey(m), d); photos++; }
    }
    if (!e.info) {
      let p = null, src = '';
      if (all.itemSeq) { p = await nedrugInfo(all.itemSeq).catch(() => null); src = 'nedrug'; }
      else if (all.pzn) { p = await leafletByPzn(all.pzn).catch(() => null); src = 'leaflet'; if (p && !e.leaflet) e.leaflet = deLeafletUrl(all.pzn); }
      if (p) {
        e.info = { efcy: p.efcy, use: p.use, warn: p.warn, se: p.se, store: p.store, open: p.openText || '', ingr: p.ingr || '', lang: p.lang, src };
        e.ingr = MedLeaflet.ingredients([all.name, p.ingr, (p.use || '').slice(0, 800)], all.atc);
        // Leere Felder aller Packungen dieser Sorte / 같은 약 모든 통의 빈 칸
        for (const x of active().filter(x => catKey(x) === catKey(m))) {
          const n = { ...x };
          if (!n.dose && p.use) n.dose = MedLeaflet.briefDose(p.use) || p.dose;
          if (!+n.openDays && p.openDays) n.openDays = p.openDays;
          if (!n.use) n.use = useLabels(p.efcy) || n.use;
          fillKids(n, p.use, false);
          n.updated = Date.now();
          S.meds[x.id] = n;
        }
        infos++;
      }
    }
    // Angebrochen ohne Frist → aus der (gespeicherten) Beschreibung / 개봉했는데 기간이 빈 통 → 설명서에서
    for (const x of active().filter(x => catKey(x) === catKey(m) && x.opened && !+x.openDays)) {
      const d = openDaysFromInfo(x);
      if (d) S.meds[x.id] = { ...S.meds[x.id], openDays: d, updated: Date.now() };
    }
    e.updated = Date.now();
  }
  keep(); render(); if (window.cloud) window.cloud.push();
  ui.bulk = l.bulkDone(photos, infos);
  if (ui.sheet && ui.sheet.type === 'settings') renderSheet();
}
function bulkHtml() {
  const l = L();
  return `<div class="box"><h3>${esc(l.bulkTitle)}</h3><p class="note" style="margin:0 0 8px">${esc(l.bulkInfo)}</p>
    <button class="btn small" data-act="fill-missing" ${ui.bulkRunning ? 'disabled' : ''}>${ms('photo_camera')}${esc(l.bulkBtn)}</button>
    ${ui.bulk ? `<p class="hint ok">${esc(ui.bulk)}</p>` : ''}</div>`;
}

// ---------- Suche nach Namen (wenn der Barcode nicht geht) / 이름으로 찾기(바코드가 안 될 때) ----------
// Lexikon (sofort), deutsche Online-Apotheke (Latein-Schrift) oder 의약품안전나라 (Hangul) über den Abruf-Server.
// 약 사전(바로), 독일 온라인 약국(라틴 글자) 또는 의약품안전나라(한글)를 가져오기 서버로 검색.
const slugName = s => decodeURIComponent(s).replace(/-/g, ' ').replace(/\s+/g, ' ').trim().replace(/\b\p{L}/gu, c => c.toUpperCase());
async function searchGerman(q) {
  const r = await viaWorker(`https://www.shop-apotheke.com/search.htm?q=${encodeURIComponent(q)}`);
  const html = await r.text(), seen = new Set(), out = [];
  const re = /href="\/[a-z-]+\/(\d{7,8})\/([^"?.]+)\.htm/g;
  let m;
  while ((m = re.exec(html)) && out.length < 12) {
    const pzn = m[1].padStart(8, '0');
    if (seen.has(pzn) || !MedCode.pznOk(pzn)) continue;
    seen.add(pzn);
    out.push({ src: 'de', pzn, name: slugName(m[2]) });
  }
  return out;
}
async function searchKorean(q) {
  const r = await viaWorker(`https://nedrug.mfds.go.kr/searchDrug?searchYn=true&itemName=${encodeURIComponent(q)}`);
  const html = await r.text(), seen = new Set(), out = [];
  const re = /getItemDetail\?itemSeq=(\d{9})[^>]*>([^<]{2,100})</g;
  let m;
  while ((m = re.exec(html)) && out.length < 12) {
    if (seen.has(m[1])) continue;
    seen.add(m[1]);
    out.push({ src: 'kr', itemSeq: m[1], name: m[2].replace(/\s+/g, ' ').trim() });
  }
  return out;
}
function findHtml() {
  const l = L(), f = ui.find || {}, q = (f.q || '').trim().toLowerCase();
  const local = !q ? [] : Object.entries(S.cat).filter(([k, e]) => k[0] !== '@' && e.name && e.name.toLowerCase().includes(q)).slice(0, 6)
    .map(([k, e]) => `<button class="mp" data-act="find-cat" data-k="${esc(k)}">${art(e, 30)}<span>${esc(e.name)}<small>${esc(l.findMine)}</small></span></button>`).join('');
  const net = (f.results || []).map((x, i) => `<button class="mp" data-act="find-pick" data-i="${i}"><span class="srcbadge ${x.src}">${x.src === 'de' ? 'DE' : 'KR'}</span><span>${esc(x.name)}<small>${esc(x.src === 'de' ? `PZN ${x.pzn}` : `${l.itemNo} ${x.itemSeq}`)}</small></span></button>`).join('');
  return `<div class="sbar"><button class="txtbtn l" data-act="close">${esc(l.close)}</button><h2>${esc(l.findTitle)}</h2><span style="min-width:56px"></span></div>
  <form class="box" id="findform"><div class="inrow"><input class="in" id="findq" value="${esc(f.q || '')}" placeholder="${esc(l.findPh)}" autocomplete="off" enterkeyhint="search"><button class="mini">${ms('search')}</button></div>
    <p class="hint">${esc(canFetch() ? l.findHint : l.findNeedLogin)}</p></form>
  ${local ? `<div class="box"><h3>${esc(l.findMineTitle)}</h3><div class="medpick">${local}</div></div>` : ''}
  ${f.busy ? `<p class="note" style="text-align:center">${esc(l.leafBusy)}</p>` : ''}
  ${f.results ? `<div class="box"><h3>${esc(l.findNetTitle)}</h3>${net ? `<div class="medpick">${net}</div>` : `<p class="note" style="margin:0">${esc(l.findNone)}</p>`}</div>` : ''}`;
}
async function runFind(q) {
  ui.find = { q, busy: canFetch(), results: null };
  renderSheet();
  if (!canFetch() || !q.trim()) { ui.find.busy = false; renderSheet(); return; }
  let res = [];
  try { res = /[가-힣]/.test(q) ? await searchKorean(q) : await searchGerman(q); } catch (e) { console.warn(e); }
  if (!ui.find || ui.find.q !== q) return;
  ui.find = { q, busy: false, results: res };
  if (ui.sheet && ui.sheet.type === 'find') renderSheet();
}

// ---------- Hausapotheke-Check: was fehlt? / 상비약 점검: 빠진 것 ----------
// Angelehnt an übliche Empfehlungen für die Hausapotheke (BBK, Apotheken), für eine Familie mit Kindern.
// 독일에서 흔히 권하는 가정 상비약 목록(연방재난청·약국 안내)을 아이 있는 집에 맞춤.
const PAIN_I = ['ibuprofen', 'paracetamol', 'aspirin', 'naproxen', 'dexibuprofen'];
const ANTIH_I = ['cetirizin', 'levocetirizin', 'loratadin', 'dimetinden', 'chlorphenamin'];
const hasI = (m, ks) => ingrOf(m).some(k => ks.includes(k));
const forKids = m => m.who !== 'adult';
const ckText = m => { const e = catOf(m) || {}, i = e.info || m.info || {}; return [m.name, m.use, e.use, i.efcy, i.ingr].filter(Boolean).join(' '); };
const CHECK = [
  { id: 'painA', test: m => hasI(m, PAIN_I) && !['syrup', 'supp', 'cream'].includes(m.kind) && !['kids', 'davin', 'arin'].includes(m.who) },
  { id: 'painK', test: m => hasI(m, PAIN_I) && m.kind === 'syrup' && forKids(m) },
  { id: 'suppK', test: m => hasI(m, PAIN_I) && m.kind === 'supp' && forKids(m) },
  { id: 'nose', test: m => hasI(m, ['xylometazolin', 'oxymetazolin']) || (['spray', 'drops'].includes(m.kind) && /nase|nasal|코|비강/i.test(ckText(m)) && !/meerwasser|salz|해수|식염/i.test(ckText(m))) },
  { id: 'saline', test: m => /meerwasser|kochsalz|salzlösung|emser|해수|식염수/i.test(ckText(m)) },
  { id: 'cough', test: m => hasI(m, ['ambroxol', 'acetylcystein', 'efeu', 'guaifenesin', 'dextromethorphan']) || /husten|bronch|기침|가래/i.test(ckText(m)) },
  { id: 'throat', test: m => /halsschmerz|rachen|angin|dorithricin|lutsch|인후|목 ?아/i.test(ckText(m)) },
  { id: 'ors', test: m => /elektrolyt|oralpädon|elotrans|rehydr|전해질/i.test(ckText(m)) },
  { id: 'diarr', test: m => hasI(m, ['loperamid']) || (/durchfall|설사/i.test(ckText(m)) && !/elektrolyt|전해질/i.test(ckText(m))) },
  { id: 'nausea', test: m => /übelkeit|erbrechen|reisekrank|vomex|dimenhydrinat|멀미|구토/i.test(ckText(m)) },
  { id: 'allergy', test: m => hasI(m, ANTIH_I) && m.kind !== 'cream' },
  { id: 'itch', test: m => m.kind === 'cream' && (hasI(m, ['dimetinden']) || /insekt|stich|juck|벌레|가려/i.test(ckText(m))) },
  { id: 'wound', test: m => m.kind === 'cream' && /wund|heilsalbe|panthenol|bepanthen|상처|재생|후시딘|마데카/i.test(ckText(m)) },
  { id: 'disinf', test: m => /desinf|octeni|betaisodona|povidon|소독|포비돈/i.test(ckText(m)) },
  { id: 'burn', test: m => /sonnenbrand|verbrenn|brandgel|brand- und|after.?sun|aloe|화상/i.test(ckText(m)) },
  // Dinge ohne Barcode: von Hand abhaken / 바코드 없는 물건: 직접 체크
  { id: 'thermo', thing: true, auto: () => (Array.isArray(S.log) ? S.log : Object.values(S.log || {})).some(x => x.kind === 'temp') },
  { id: 'plaster', thing: true }, { id: 'bandage', thing: true }, { id: 'tweezers', thing: true },
  { id: 'tick', thing: true }, { id: 'gloves', thing: true }, { id: 'scissors', thing: true }, { id: 'coldpack', thing: true },
];
const checkData = () => S.cat['@check'] || { have: {}, skip: {}, shop: {} };
function saveCheck(fn) {
  const d = JSON.parse(JSON.stringify(checkData()));
  for (const k of ['have', 'skip', 'shop']) d[k] = d[k] || {};
  fn(d); d.updated = Date.now(); S.cat['@check'] = d;
  keep(); render(); if (window.cloud) window.cloud.push();
}
// Stand je Punkt: ok (Mittel da), old (nur abgelaufene), miss, skip / 항목 상태
function checkState() {
  const d = checkData(), act = active();
  return CHECK.map(c => {
    if ((d.skip || {})[c.id]) return { c, st: 'skip' };
    if (c.thing) return { c, st: (d.have || {})[c.id] || (c.auto && c.auto()) ? 'ok' : 'miss' };
    const hit = act.filter(m => { try { return c.test(m); } catch (e) { return false; } });
    const good = hit.filter(m => statusOf(m).st !== 'bad');
    return { c, st: good.length ? 'ok' : hit.length ? 'old' : 'miss', meds: good.length ? good : hit };
  });
}
const checkMissing = () => checkState().filter(x => x.st === 'miss' || x.st === 'old').length;

}

    return `<div class="ck ck-${st}"><span class="ckdot">${st === 'ok' ? ms('check') : st === 'skip' ? '–' : '!'}</span>
      <div class="ckb"><b>${esc(t[0])}</b><small>${esc(sub)}</small>${st === 'miss' || st === 'old' ? `<small class="ckex">${esc(l.checkEx)} ${esc(t[1])}</small>` : ''}

  const part = (title, list) => list.length ? `<div class="box"><h3>${esc(title)} <small>${list.length}</small></h3>${list.map(row).join('')}</div>` : '';
  return `<div class="sbar"><button class="txtbtn l" data-act="close">${esc(l.close)}</button><h2>${esc(l.checkTitle)}</h2><span style="min-width:56px"></span></div>
  <p class="note" style="margin-top:0">${esc(l.checkIntro)}</p>
  ${miss.length ? part(l.checkMiss, miss.filter(x => !x.c.thing)) + part(l.checkMissThings, miss.filter(x => x.c.thing)) : `<div class="post ok">${ms('check_circle')}${esc(l.checkAll)}</div>`}
  ${part(l.checkOk, ok)}${part(l.checkSkipped, skip)}
  <p class="note">${esc(l.checkNote)}</p>`;
}

// ---------- Was hilft? Beschwerden → passende Mittel / 증상으로 약 찾기 ----------
// Nur nicht abgelaufene Mittel, die zur Person passen; Reihenfolge: passt am besten, dann zuerst ablaufend (FEFO).
// 기한이 남았고 그 사람에게 맞는 약만. 증상이 많이 맞는 순, 그다음 기한이 빨리 끝나는 것부터.
const SYMPTOMS = [
  ['fever', /fieber|temperatur|열|해열|발열/i], ['pain', /schmerz|kopf|glieder|zahn|통증|두통|진통|치통|몸살|생리통/i],
  ['cough', /husten|bronch|schleim|기침|가래|기관지/i], ['nose', /schnupfen|nase|nasal|rhinitis|코막힘|콧물|비염|코감기/i],
  ['throat', /hals|rachen|schluck|인후|목 ?아|편도/i], ['belly', /durchfall|magen|darm|bauch|blähung|설사|소화|복통|위장|배탈/i],
  ['constip', /verstopf|abführ|변비|배변/i], ['nausea', /übelkeit|erbrechen|reise|구토|멀미|메스꺼/i],
  ['allergy', /allerg|juck|heuschnupfen|알레르기|가려|두드러기/i], ['wound', /wunde|verbrenn|schürf|haut|상처|화상|피부|찰과/i],
  ['insect', /insekt|stich|mücke|벌레|모기|물림/i], ['eye', /auge|bindehaut|눈|결막|안구/i], ['ear', /\bohr|귀|중이/i],
];
function medText(m) {
  const e = catOf(m) || {}, i = e.info || m.info || {};
  return [m.name, m.use, e.use, L().drawers[drawerOf(m)], i.efcy].filter(Boolean).join(' ');
}
const kidOk = (m, w) => !['davin', 'arin'].includes(w) || (m.who !== 'adult' && !/^⚠/.test(doseFor(m, w) || ''));
function sickHtml() {
  const l = L(), s = ui.sick || { who: 'davin', sym: [] };
  const ppl = PEOPLE.map(w => `<button class="chip p-${w} ${s.who === w ? 'on' : ''}" data-act="sick-who" data-v="${w}">${esc(pName(w))}</button>`).join('');
  const syms = SYMPTOMS.map(([k]) => `<button class="chip ${s.sym.includes(k) ? 'on' : ''}" data-act="sick-sym" data-v="${k}">${esc(l.sym[k])}</button>`).join('');
  let list = '';
  if (s.sym.length) {
    const fits = m => !m.who || m.who === s.who || (m.who === 'kids' && ['davin', 'arin'].includes(s.who)) || (m.who === 'adult' && ['mom', 'dad'].includes(s.who));
    const scored = groups(active().filter(m => statusOf(m).st !== 'bad' && fits(m) && kidOk(m, s.who)))
      .map(g => { const t = medText(g[0]); return { g, n: s.sym.filter(k => SYMPTOMS.find(x => x[0] === k)[1].test(t)).length }; })
      .filter(x => x.n).sort((a, b) => b.n - a.n || byLimit(a.g[0], b.g[0]));
    list = scored.map(({ g }) => {
      const m = g[0], st = doseState(m, s.who), clash = ingrClash(m, s.who), kd = doseFor(m, s.who);
      return `<div class="rec">${art(m, 46)}<div class="rb"><b>${esc(m.name)}</b>
        <small>${esc([fmt(limitOf(m).end) ? `${l.lReal} ${fmt(limitOf(m).end)}` : '', multiBox() ? boxName(boxOf(m)) : '', g.length > 1 ? l.packs(g.length) : ''].filter(Boolean).join(' · '))}</small>
        ${kd ? `<small class="kdl">${whoChip(s.who)} ${esc(kd)}</small>` : ''}
        ${st.full ? `<small class="bad-t">${esc(l.maxReached(st.count, st.maxPerDay))}</small>` : st.early ? `<small class="soon-t">${esc(l.nextAt(whenText(st.next)))}</small>` : ''}
        ${clash ? `<small class="bad-t">${esc(l.wIngr(ingrNames(clash.k), clash.log.name, hhmm(clash.log.t)))}</small>` : ''}</div>

  }
  return `<div class="sbar"><button class="txtbtn l" data-act="close">${esc(l.close)}</button><h2>${esc(l.sickTitle)}</h2><span style="min-width:56px"></span></div>
  <div class="box"><label class="f">${esc(l.sickWho)}</label><div class="wrapchips">${ppl}</div>
    <label class="f">${esc(l.sickWhat)}</label><div class="wrapchips">${syms}</div></div>
  ${s.sym.length ? `<div class="box"><h3>${esc(l.sickList)}</h3>${list}</div>` : `<p class="note" style="text-align:center">${esc(l.sickPick)}</p>`}
  <p class="note">${esc(l.sickNote)}</p>`;
}

// ---------- Ablauf-Erinnerung (Web Push) / 만료 알림 ----------
// Das Handy rechnet die Tage aus (30 und 7 Tage vorher, am letzten Tag; angebrochene Kurzläufer 3 Tage vorher)
// und schickt dem Server nur diese Tage. Den Text legt es in den Cache „meds-alerts“, den sw.js beim Push liest.
// 휴대폰이 알림 날짜(30일·7일 전, 마지막 날, 개봉 후 짧은 약은 3일 전)를 계산해 서버에는 날짜만 보냄.
// 알림 문구는 'meds-alerts' 저장소에 넣어 두고, 푸시가 오면 sw.js가 읽어서 보여 줌.
const WORKER = 'https://meds-fetch.weekly-meals-reader.workers.dev';
const VAPID_PUBLIC = 'BGBnN4Z-zgrtxpiREd2xLP4HToyuuKyx1HRv1sMbBAJ3Iw2OuohsIZMyrkZKkLN-eVCopdxbwSRGpsI5rn_I3fc';
const PUSHKEY = 'meds:push';
const pushEndpoint = () => { try { return localStorage.getItem(PUSHKEY) || ''; } catch (e) { return ''; } };
const canPush = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window && location.protocol === 'https:';
function alertPlan() {
  const l = L(), byDate = {}, add = (d, text) => { if (d >= today()) (byDate[d] = byDate[d] || []).push(text); };
  for (const m of active()) {
    const { end, by } = limitOf(m);
    if (!end) continue;
    add(addDays(end, -30), l.a30(m.name, fmtShort(end)));
    add(addDays(end, -7), l.a7(m.name, fmtShort(end)));
    if (by === 'open' && m.openDays <= 30) add(addDays(end, -3), l.a3(m.name, fmtShort(end)));
    add(end, l.a0(m.name));
  }
  return byDate;
}
async function workerPost(p, body) {
  const tok = window.cloud && await window.cloud.token();
  if (!tok) throw new Error('login');
  const r = await fetch(WORKER + p, { method: 'POST', headers: { Authorization: 'Bearer ' + tok, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok || j.ok === false) throw new Error(j.error || 'http' + r.status);
  return j;
}
// Nach Änderungen: Text in den Cache, neue Tage an den Server (nur wenn sich etwas geändert hat).
// 바뀌면: 문구는 저장소에, 바뀐 날짜만 서버로.
let alertTimer = 0, alertSig = '';
function syncAlerts() {
  clearTimeout(alertTimer);
  alertTimer = setTimeout(async () => {
    const byDate = alertPlan(), sig = JSON.stringify([S.lang, byDate]);
    if (sig === alertSig) return;
    alertSig = sig;
    try { const c = await caches.open('meds-alerts'); await c.put('alerts', new Response(JSON.stringify({ lang: S.lang, byDate }))); } catch (e) {}
    const ep = pushEndpoint();
    if (ep && canFetch()) workerPost('/push/days', { endpoint: ep, days: Object.keys(byDate) }).catch(e => console.warn('push days', e));
  }, 1500);
}
const b64ToBytes = s => { const b = atob((s + '='.repeat((4 - s.length % 4) % 4)).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(b, c => c.charCodeAt(0)); };
async function pushOn() {
  const l = L();
  if (await Notification.requestPermission() !== 'granted') { toast(l.notiDenied); return; }
  const reg = await navigator.serviceWorker.ready;
  const sub = (await reg.pushManager.getSubscription()) || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(VAPID_PUBLIC) });
  alertSig = '';
  await workerPost('/push/subscribe', { sub: sub.toJSON(), days: Object.keys(alertPlan()) });
  try { localStorage.setItem(PUSHKEY, sub.endpoint); } catch (e) {}
  syncAlerts();
  toast(l.notiOnToast);
}
async function pushOff() {
  const ep = pushEndpoint();
  try { localStorage.removeItem(PUSHKEY); } catch (e) {}
  if (ep) await workerPost('/push/unsubscribe', { endpoint: ep }).catch(() => {});
  try { const reg = await navigator.serviceWorker.ready, sub = await reg.pushManager.getSubscription(); if (sub) await sub.unsubscribe(); } catch (e) {}
}
