<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>약상자 · Hausapotheke</title>
<meta name="theme-color" content="#f7efe1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="약상자">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,1,0&icon_names=add,barcode_reader,check,check_circle,child_care,close,cloud_done,delete,download,edit,error,flashlight_off,flashlight_on,history,image,info,keyboard,open_in_new,qr_code_scanner,restore,schedule,search,settings,upload&display=block">
<style>
:root {
  --red: #d9443a; --red2: #b8352d; --cream: #f7efe1; --ink: #3a2a20; --mut: #8a7562; --line: #eadfcd; --card: #fff;
  --wood: #d0a46c; --wood2: #b4834e; --cab: #a87a47; --cab2: #8c6235;
  --bad: #e5484d; --soon: #f0a020; --ok: #3aa76d; --none: #b3a796;
  --k1: #ffe27a; --k1k: #7a5b00; --k2: #e8c6f5; --k2k: #8a3fb0;
  --jua: "Jua", -apple-system, "Apple SD Gothic Neo", sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--cream); color: var(--ink); font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", "Noto Sans KR", Roboto, sans-serif; }
body { padding: env(safe-area-inset-top) 0 calc(100px + env(safe-area-inset-bottom)); }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
.ms { font-family: 'Material Symbols Rounded'; font-weight: normal; font-style: normal; font-size: 22px; line-height: 1; letter-spacing: normal; text-transform: none; display: inline-block; white-space: nowrap; direction: ltr; -webkit-font-smoothing: antialiased; vertical-align: middle; }
.wrap { max-width: 640px; margin: 0 auto; padding: 0 12px; }

/* Deckel / 구급상자 뚜껑 */
.lid { background: var(--red); color: #fff; margin: 22px 0 0; border-radius: 20px 20px 12px 12px; padding: 12px 12px 12px; position: relative; box-shadow: inset 0 -6px 0 var(--red2); }
.lid::before { content: ''; position: absolute; left: 50%; top: -12px; width: 66px; height: 20px; transform: translateX(-50%); border: 6px solid #6b5b52; border-bottom: 0; border-radius: 14px 14px 0 0; }
.lid .t { display: flex; align-items: center; gap: 10px; }
.wc { width: 32px; height: 32px; background: #fff; border-radius: 9px; position: relative; flex: none; }
.wc::before, .wc::after { content: ''; position: absolute; background: var(--red); border-radius: 2px; }
.wc::before { left: 12px; top: 6px; width: 8px; height: 20px; } .wc::after { left: 6px; top: 12px; width: 20px; height: 8px; }
.lid b { font: 400 20px var(--jua); flex: 1; }
.lbtn { border: 0; background: rgba(0,0,0,.18); color: #fff; border-radius: 10px; height: 34px; min-width: 34px; padding: 0 8px; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; }
.lbtn .ms { font-size: 20px; }

/* Zettel und Korb / 포스트잇과 바구니 */
.post { margin: 14px 6px 0; background: #fff3a8; padding: 9px 12px; transform: rotate(-1deg); box-shadow: 0 3px 6px rgba(0,0,0,.12); font: 400 15px var(--jua); position: relative; display: flex; gap: 8px; align-items: center; }
.post::before { content: ''; position: absolute; top: -7px; left: 44%; width: 46px; height: 14px; background: rgba(255,255,255,.65); transform: rotate(3deg); }
.post.ok { background: #d9f2c9; } .post .ms { color: var(--ok); }
.basket { margin: 14px 0 0; border-radius: 6px 6px 22px 22px; padding: 6px 6px 4px; background: repeating-linear-gradient(90deg, #e8cb97 0 7px, #dcb97f 7px 14px); border-top: 6px solid #c79a5c; box-shadow: 0 3px 0 #b78c52; }
.basket h5 { margin: 0 4px; font: 400 14px var(--jua); display: flex; align-items: center; gap: 4px; }
.basket h5 .ms { font-size: 18px; color: var(--bad); }
.basket h5 small { background: var(--bad); color: #fff; border-radius: 8px; padding: 0 6px; font-size: 11px; }
.row-x { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.row-x::-webkit-scrollbar { display: none; }

/* Ein Medikament als Bild / 약 그림 하나 */
.it { flex: 0 0 72px; border: 0; background: none; padding: 8px 0 0; text-align: center; position: relative; color: var(--ink); }
.it svg { display: block; margin: 0 auto; height: 58px; }
.it .lb { display: block; font-size: 10px; line-height: 1.15; height: 24px; overflow: hidden; margin-top: 2px; font-weight: 600; word-break: break-word; }
.dot { position: absolute; top: 0; right: 2px; min-width: 30px; height: 30px; padding: 0 4px; border-radius: 15px; color: #fff; display: grid; place-items: center; font: 400 10px var(--jua); box-shadow: 0 2px 3px rgba(0,0,0,.2); transform: rotate(8deg); white-space: nowrap; }
.dot.bad, .sd.bad { background: var(--bad); } .dot.soon, .sd.soon { background: var(--soon); } .dot.ok, .sd.ok { background: var(--ok); } .dot.none, .sd.none, .dot.gone, .sd.gone { background: var(--none); }
.stack { position: relative; display: block; height: 58px; }
.stack svg { position: absolute; left: 50%; transform: translateX(-50%); }
.stack svg:first-child { transform: translateX(-30%) scale(.92); opacity: .55; }
.x2 { position: absolute; left: 4px; bottom: 30px; background: var(--ink); color: #fff; border-radius: 6px; font: 400 10px/1.5 var(--jua); padding: 0 4px; }

/* Leiste: Personen, Suche, Ansicht / 사람·검색·보기 */
.bar { display: flex; align-items: center; gap: 6px; margin: 14px 0 0; }
.who { flex: 1; min-width: 0; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.who::-webkit-scrollbar { display: none; }
.who button { flex: none; border: 0; background: #fff; border-radius: 999px; padding: 5px 11px; font-size: 13px; font-weight: 700; box-shadow: inset 0 -2px 0 #e7dccb; }
.who button.on { background: var(--ink); color: #fff; box-shadow: none; }
.ib { flex: none; border: 0; width: 34px; height: 34px; border-radius: 50%; background: #fff; display: grid; place-items: center; box-shadow: inset 0 -2px 0 #e7dccb; }
.ib.on { background: var(--ink); color: #fff; }
.vt { flex: none; display: flex; background: #eadfcd; border-radius: 10px; padding: 2px; font-size: 12px; font-weight: 700; }
.vt button { border: 0; background: none; padding: 5px 9px; border-radius: 8px; color: var(--mut); }
.vt button.on { background: #fff; color: var(--red); box-shadow: 0 1px 2px rgba(0,0,0,.1); }
.search { display: flex; align-items: center; gap: 6px; background: #fff; border-radius: 14px; padding: 0 12px; height: 42px; margin-top: 10px; box-shadow: inset 0 -2px 0 #e7dccb; }
.search input { border: 0; outline: 0; flex: 1; background: transparent; min-width: 0; }
.search .ms { color: var(--mut); }

/* Schrank / 서랍장 */
.cab { margin: 12px 0 0; background: var(--cab); border-radius: 14px; padding: 5px; box-shadow: inset 0 -4px 0 var(--cab2); }
.dr { width: 100%; border: 0; display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 10px; border-radius: 9px; background: linear-gradient(#ddb37d, var(--wood)); box-shadow: inset 0 -3px 0 var(--wood2), inset 0 1px 0 rgba(255,255,255,.35); color: var(--ink); text-align: left; }
.dr + .dr, .tray + .dr { margin-top: 5px; }
.plate { flex: none; background: #fffaf0; border: 2px solid #9aa0a6; border-radius: 4px; padding: 0 8px; font: 400 14px/1.5 var(--jua); color: var(--ink); min-width: 84px; text-align: center; }
.cnt { font: 400 13px var(--jua); color: #5a3f22; flex: none; }
.pips { flex: 1; display: flex; flex-wrap: wrap; gap: 3px; min-width: 0; }
.pips i { width: 9px; height: 9px; border-radius: 50%; display: block; box-shadow: 0 0 0 1.5px rgba(255,255,255,.7); }
.knob { flex: none; width: 16px; height: 16px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #e9ecef, #8a9096); box-shadow: 0 1px 2px rgba(0,0,0,.3); }
.dr.open { border-radius: 9px 9px 0 0; }
.dr.open .knob { background: radial-gradient(circle at 35% 35%, #fff, #b0b5ba); }
.tray { background: #f2e1c3; border-radius: 0 0 9px 9px; box-shadow: inset 0 6px 8px -4px rgba(90,60,30,.35); padding: 4px 6px 2px; }

/* Liste / 목록 보기 */
.sec { margin: 12px 0 0; background: #fff; border-radius: 18px; padding: 4px 12px 2px; }
.sec .sh { display: flex; align-items: center; gap: 6px; padding: 6px 0; font: 400 13px var(--jua); }
.sec .sh .plate { min-width: 0; font-size: 13px; }
.sec .sh small { color: var(--mut); font-family: inherit; font-size: 12px; }
.lr { width: 100%; border: 0; background: none; display: flex; align-items: center; gap: 10px; padding: 6px 0; border-top: 1px solid #f1e8da; text-align: left; color: var(--ink); }
.lr svg { height: 34px; flex: none; width: 24px; }
.lr .nm { flex: 1; min-width: 0; font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lr .nm small { display: block; font-weight: 500; color: var(--mut); font-size: 11px; overflow: hidden; text-overflow: ellipsis; }
.sd { flex: none; min-width: 48px; text-align: center; border-radius: 999px; color: #fff; font: 400 12px/22px var(--jua); padding: 0 7px; }
.kid { display: inline-flex; align-items: center; border-radius: 7px; padding: 0 6px; font-size: 12px; font-weight: 700; }
.kid.k1 { background: #fff3c2; color: var(--k1k); } .kid.k2 { background: #f6e5fb; color: var(--k2k); }
.kid.kids { background: #e5f0ff; color: #2c6db5; } .kid.adult { background: #f1e8da; color: var(--mut); }
.empty { text-align: center; color: var(--mut); padding: 30px 10px; font: 400 15px var(--jua); }
.morebtn { display: block; margin: 16px auto 0; border: 0; background: none; color: var(--mut); font-size: 14px; }

.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; padding: 10px 12px calc(12px + env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--cream) 65%, rgba(247,239,225,0)); }
.dock .wrap { display: flex; gap: 10px; padding: 0; }
.big { flex: 1; height: 56px; border: 0; border-radius: 18px; background: var(--red); color: #fff; font: 400 19px var(--jua); display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: inset 0 -4px 0 var(--red2), 0 6px 14px rgba(217,68,58,.3); }
.big .ms { font-size: 26px; }
.big.sec2 { flex: none; width: 56px; background: #fff; color: var(--red); box-shadow: inset 0 -3px 0 #e7dccb, 0 2px 8px rgba(0,0,0,.08); }

/* Blätter / 시트 */
.sheetbg { position: fixed; inset: 0; z-index: 20; background: rgba(40,25,15,.38); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--cream); width: 100%; max-width: 640px; max-height: 94vh; max-height: 94dvh; border-radius: 24px 24px 0 0; overflow-y: auto; padding: 0 14px calc(20px + env(safe-area-inset-bottom)); }
.sbar { position: sticky; top: 0; z-index: 2; background: var(--cream); display: flex; align-items: center; gap: 8px; padding: 12px 0 10px; }
.sbar h2 { flex: 1; margin: 0; font: 400 19px var(--jua); text-align: center; }
.sbar .txtbtn { border: 0; background: none; color: var(--red); font: 400 17px var(--jua); padding: 6px 4px; min-width: 56px; }
.sbar .txtbtn.l { text-align: left; color: var(--mut); }
.sbar .txtbtn.r { text-align: right; }
.box { background: var(--card); border-radius: 18px; padding: 14px; margin-bottom: 10px; }
.box h3 { margin: 0 0 6px; font: 400 15px var(--jua); color: var(--red); display: flex; align-items: center; gap: 6px; }
.box h3 .ms { font-size: 18px; }
label.f { display: block; font-size: 13px; color: var(--mut); font-weight: 700; margin: 12px 0 4px; }
label.f:first-child { margin-top: 0; }
.in { width: 100%; border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; background: #fffcf6; outline: 0; min-height: 44px; }
.in:focus { border-color: var(--red); background: #fff; }
textarea.in { min-height: 76px; resize: vertical; }
.row2 { display: flex; gap: 8px; } .row2 > * { flex: 1; min-width: 0; }
.inrow { display: flex; gap: 6px; align-items: center; } .inrow .in { flex: 1; min-width: 0; }
.mini { border: 1.5px solid var(--line); background: var(--card); border-radius: 10px; padding: 0 10px; height: 44px; font-size: 14px; white-space: nowrap; }
.wrapchips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 8px 0 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1.5px solid var(--line); background: var(--card); border-radius: 999px; padding: 5px 12px; font-size: 14px; white-space: nowrap; }
.chip.on { background: var(--ink); border-color: var(--ink); color: #fff; font-weight: 700; }
.chip.plate-c { font-family: var(--jua); border-radius: 6px; border-color: #c9ccd0; background: #fffaf0; }
.chip.plate-c.on { background: var(--wood); border-color: var(--wood2); color: var(--ink); box-shadow: inset 0 -2px 0 var(--wood2); }
.hint { font-size: 13px; color: var(--mut); margin: 6px 0 0; }
.hint.ok { color: var(--ok); font-weight: 700; }
.codeline { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 13px; color: var(--mut); }
.codeline b { color: var(--ink); font-weight: 600; }
.links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.links a { display: inline-flex; align-items: center; gap: 4px; text-decoration: none; color: var(--red2); background: #fbe9e6; border-radius: 10px; padding: 6px 10px; font-size: 14px; font-weight: 700; }
.links a .ms { font-size: 16px; }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.btn { flex: 1; border: 0; border-radius: 16px; height: 50px; padding: 0 14px; background: var(--red); color: #fff; font: 400 17px var(--jua); display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; box-shadow: inset 0 -3px 0 var(--red2); }
.btn.ghost { background: var(--card); color: var(--ink); box-shadow: inset 0 -3px 0 #e7dccb; }
.btn.danger { background: var(--card); color: var(--bad); box-shadow: inset 0 -3px 0 #f3d2d3; }
.btn.small { height: 42px; font-size: 15px; flex: none; }
.note { font-size: 12px; color: var(--mut); line-height: 1.5; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom)); z-index: 60; background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 14px; max-width: 90vw; box-shadow: 0 6px 20px rgba(0,0,0,.2); }
.ok-t { color: var(--ok); font-weight: 700; }

/* Detail / 상세 */
.hero { background: #fff; border-radius: 22px; padding: 14px; display: flex; gap: 12px; align-items: center; position: relative; margin-top: 18px; }
.hero svg { height: 110px; flex: none; }
.hero h2 { margin: 0; padding-right: 64px; font: 400 21px/1.2 var(--jua); word-break: break-word; }
.hero .s { font-size: 13px; color: var(--mut); margin-top: 3px; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.bigdot { position: absolute; right: 6px; top: -12px; min-width: 70px; height: 70px; padding: 0 6px; border-radius: 35px; color: #fff; display: grid; place-items: center; text-align: center; font: 400 11px/1.15 var(--jua); transform: rotate(10deg); box-shadow: 0 3px 6px rgba(0,0,0,.2); }
.bigdot b { font-size: 17px; display: block; font-weight: 400; }
.bigdot.bad { background: var(--bad); } .bigdot.soon { background: var(--soon); } .bigdot.ok { background: var(--ok); } .bigdot.none, .bigdot.gone { background: var(--none); }
.tagc { margin: 12px 6px 10px; background: #fffaf0; border: 2px solid #e6d7bf; border-radius: 6px 20px 20px 6px; padding: 10px 14px 10px 30px; position: relative; font-size: 14px; }
.tagc::before { content: ''; position: absolute; left: 9px; top: 50%; width: 11px; height: 11px; margin-top: -6px; border-radius: 50%; background: var(--cream); border: 2px solid #e6d7bf; }
.tagc .r { display: flex; justify-content: space-between; gap: 10px; padding: 2px 0; }
.tagc .r span:first-child { color: var(--mut); }
.tagc .r.main { font-weight: 800; }
.tagc .r.main.bad, .tagc .r.main.bad span { color: var(--bad); } .tagc .r.main.soon, .tagc .r.main.soon span { color: #c77c00; } .tagc .r.main.ok, .tagc .r.main.ok span { color: var(--ok); }
.tagc .why { font-size: 12px; color: var(--mut); margin-top: 4px; }
.tagc .warn { font-size: 12px; color: #c77c00; font-weight: 700; margin-top: 4px; }
.kc { display: flex; gap: 8px; margin-bottom: 10px; }
.kc div { flex: 1; background: #fff; border-radius: 18px; padding: 10px; text-align: center; min-width: 0; }
.face { width: 46px; height: 46px; border-radius: 50%; margin: 0 auto 4px; display: grid; place-items: center; font: 400 14px var(--jua); white-space: nowrap; }
.face.k1 { background: var(--k1); color: var(--k1k); } .face.k2 { background: var(--k2); color: var(--k2k); }
.kc b { font: 400 18px var(--jua); display: block; word-break: break-word; }
.pre { white-space: pre-wrap; margin: 0; }
.same { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: none; padding: 6px 0; border-top: 1px solid #f1e8da; text-align: left; }
.same:first-of-type { border-top: 0; }
.same span:first-child { flex: 1; font-size: 14px; }
.sugg { display: flex; flex-direction: column; gap: 4px; margin-top: 4px; }
.sugg:empty { display: none; }
.sug { display: flex; align-items: center; gap: 8px; border: 1.5px solid var(--line); background: #fffaf0; border-radius: 12px; padding: 4px 10px; text-align: left; }
.sug svg { height: 26px; width: 18px; flex: none; }
.sug span { font-weight: 700; font-size: 14px; } .sug small { display: block; font-weight: 500; color: var(--mut); font-size: 11px; }
.info .src { color: var(--mut); font-family: -apple-system, sans-serif; font-size: 12px; }
.openline { background: #eef8f1; color: #1f7a46; border-radius: 10px; padding: 6px 10px; margin-bottom: 6px; font-size: 14px; font-weight: 600; }
.openline p { margin: 0; }
details.orig summary { font-size: 12px; color: var(--mut); font-weight: 500; }
details.orig p { color: var(--mut); font-size: 13px; }
.leafrow { display: flex; gap: 8px; margin-top: 8px; }
.info details { border-top: 1px solid #f1e8da; padding: 6px 0; }
.info details:first-of-type { border-top: 0; }
.info summary { font-weight: 700; cursor: pointer; font-size: 14px; }
.info details p { font-size: 14px; margin-top: 4px; color: #4a3a2e; }

/* Kamera / 카메라 */
.scan { position: fixed; inset: 0; z-index: 40; background: #000; color: #fff; display: flex; flex-direction: column; }
.scan video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.scan .shade { position: absolute; inset: 0; pointer-events: none; display: grid; place-items: center; }
.scan .frame { width: min(78vw, 360px); aspect-ratio: 4 / 3; border-radius: 22px; box-shadow: 0 0 0 9999px rgba(0,0,0,.45); border: 3px solid rgba(255,255,255,.9); position: relative; }
.scan .frame.hit { border-color: #4ade80; }
.scan .frame::after { content: ''; position: absolute; left: 8%; right: 8%; top: 50%; height: 2px; background: rgba(74,222,128,.8); animation: sweep 1.8s ease-in-out infinite; }
@keyframes sweep { 0%,100% { transform: translateY(-60px); } 50% { transform: translateY(60px); } }
.scan .tbar { position: relative; z-index: 2; display: flex; justify-content: space-between; align-items: center; padding: calc(12px + env(safe-area-inset-top)) 16px 8px; gap: 8px; }
.scan .rbtn { width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(0,0,0,.5); color: #fff; display: grid; place-items: center; }
.scan .rbtn.on { background: #fff; color: #000; }
.scan .msg { position: relative; z-index: 2; text-align: center; padding: 0 24px; font-size: 15px; text-shadow: 0 1px 3px rgba(0,0,0,.8); }
.scan .msg small { display: block; opacity: .8; font-size: 13px; margin-top: 4px; }
.scan .grow { flex: 1; }
.scan .bbar { position: relative; z-index: 2; padding: 12px 16px calc(16px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 10px; }
.scan .zoom { display: flex; align-items: center; gap: 10px; font-size: 13px; }
.scan .zoom input { flex: 1; accent-color: #4ade80; }
.scan .brow { display: flex; gap: 8px; }
.scan .brow button { flex: 1; height: 48px; border-radius: 14px; border: 0; background: rgba(255,255,255,.16); color: #fff; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px; backdrop-filter: blur(6px); }
.scan form { display: flex; gap: 8px; }
.scan form input { flex: 1; min-width: 0; height: 48px; border-radius: 14px; border: 0; padding: 0 14px; color: #000; }
.scan form button { flex: none; height: 48px; padding: 0 18px; border: 0; border-radius: 14px; background: #4ade80; color: #000; font-weight: 700; }

// 데이터: S.meds = { id → 약 한 통 }. 실제 기한 = 인쇄된 유효기간과 (개봉일 + 개봉 후 기간) 중 빠른 날.

const KEY = 'meds:v1', UIKEY = 'meds:ui';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

let S = (() => {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.meds) return s; } catch (e) {}

})();
const keep = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

// 약 종류 정보(통 하나가 아니라 제품)는 S.cat에 남음. 약을 지워도 사라지지 않음. 열쇠는 바코드, 없으면 이름.

// Familien-Dokument (Lexikon-Eintrag „@kids“) – nie im öffentlichen Code.

const KIDS = ['k1', 'k2'];
const kidsData = () => S.cat['@kids'] || S.kids || {};
const kidOf = w => kidsData()[w] || {};
function kidMonths(w) {
  const b = kidOf(w).birth;
  if (!/^\d{4}-\d{2}$/.test(b || '')) return -1;
  const now = new Date();
  return (now.getFullYear() * 12 + now.getMonth()) - (+b.slice(0, 4) * 12 + (+b.slice(5, 7) - 1));

const kidAgeText = mo => mo < 0 ? '' : S.lang === 'de' ? `${Math.floor(mo / 12)} J. ${mo % 12} M.` : `만 ${Math.floor(mo / 12)}세 ${mo % 12}개월`;
// Deutsche Häufigkeit kurz auf Koreanisch / 독일어 횟수 표현을 한국어로
function freqKo(f) {
  if (S.lang !== 'ko' || !f) return f;
  return f.replace(/bis zu (\d+)[- ]?mal (?:täglich|am Tag|pro Tag)/i, '하루 최대 $1번')

}

function kidDoseText(section, w) {
  const mo = kidMonths(w);
  const r = MedLeaflet.kidDose(section, { months: mo, kg: +kidOf(w).kg || 0 });
  if (!r) return '';
  if (r.warn) return `⚠ ${L().kidNo} (${r.text.slice(0, 80)})`;
  return [r.amount, freqKo(r.freq)].filter(Boolean).join(' · ') + (r.range ? ` (${r.range})` : '');

function fillKids(d, section, overwrite) {
  const got = [];
  if (!section) return got;
  for (const w of kidsFor(d.who || '')) {
    const f = w === 'k1' ? 'doseK1' : 'doseK2';
    if (d[f] && !overwrite) continue;
    const t = kidDoseText(section, w);
    if (t) { d[f] = t; got.push(L().who[w]); }
  }
  return got;

function toCat(m) {
  const k = catKey(m);
  if (!k) return null;
  const e = { ...(S.cat[k] || {}) };
  for (const f of PROD) if (m[f] !== undefined && m[f] !== '' && m[f] !== 0) e[f] = m[f];

  return (S.cat[k] = e);

const L = () => T[S.lang] || T.ko;

// ---------- Datum / 날짜 ----------
const pad = n => String(n).padStart(2, '0');
const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const toUTC = s => Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10));
const addDays = (s, n) => { const d = new Date(toUTC(s) + n * 864e5); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`; };
const diff = (a, b) => Math.round((toUTC(b) - toUTC(a)) / 864e5);
const fmt = s => !s ? '' : S.lang === 'de' ? `${s.slice(8, 10)}.${s.slice(5, 7)}.${s.slice(0, 4)}` : `${s.slice(0, 4)}.${s.slice(5, 7)}.${s.slice(8, 10)}`;
const fmtShort = s => !s ? '' : S.lang === 'de' ? `${+s.slice(8, 10)}.${+s.slice(5, 7)}.${s.slice(2, 4)}` : `${s.slice(2, 4)}.${+s.slice(5, 7)}.${+s.slice(8, 10)}`;
const openLabel = n => n % 365 === 0 ? (S.lang === 'de' ? `${n / 365} J.` : `${n / 365}년`) : n % 30 === 0 || n === 182 || n === 91 ? L().months(Math.round(n / 30.4)) : n % 7 === 0 && n > 7 ? L().weeks(n / 7) : `${n}${S.lang === 'de' ? ' T.' : '일'}`;

// Wann ist die Packung wirklich zu Ende? / 실제로 언제까지 쓸 수 있나
function limitOf(m) {
  const openEnd = m.opened && m.openDays ? addDays(m.opened, m.openDays) : '';

  return { end, by, openEnd };
}
function statusOf(m) {
  const { end } = limitOf(m);
  if (m.gone) return { st: 'gone', d: null };
  if (!end) return { st: 'none', d: null };
  const d = diff(today(), end);
  return { st: d < 0 ? 'bad' : d <= 30 ? 'soon' : 'ok', d };
}
// Kurzer Text für den runden Aufkleber / 동그란 스티커 글자
function stk(m) {
  const { st, d } = statusOf(m), l = L();
  if (st === 'gone') return '✓';
  if (st === 'none') return l.none;

  return d === 0 ? l.todayShort : l.dShort(d);
}
const whoChip = w => w ? `<span class="kid ${w}">${esc(L().who[w])}</span>` : '';
const active = () => Object.values(S.meds).filter(m => !m.gone);
const byLimit = (a, b) => (limitOf(a).end || '9999').localeCompare(limitOf(b).end || '9999') || String(a.name).localeCompare(String(b.name));

// Schublade: gewählt oder aus Anwendung/Name geraten. / 서랍: 고른 것, 없으면 용도·이름으로 추측.
function guessDrawer(text) {
  const t = String(text || '').toLowerCase();
  if (/열|통증|두통|진통|해열|fieber|schmerz|ibu|paracet|ben-u-ron|nurofen|tylenol|타이레놀/.test(t)) return 'pain';
  if (/감기|기침|코|가래|목|erkält|husten|nase|schnupf|hals|grippe|prospan|otriven/.test(t)) return 'cold';
  if (/배|설사|변비|소화|구토|멀미|magen|darm|durchfall|übel|verstopf|iberogast|lefax/.test(t)) return 'belly';
  if (/피부|상처|화상|모기|벌레|연고|wund|haut|salbe|creme|stich|bepanthen|fenistil gel/.test(t)) return 'skin';
  if (/눈|귀|안약|auge|ohr/.test(t)) return 'eye';
  return 'etc';
}
const drawerOf = m => DRAWERS.includes(m.drawer) ? m.drawer : guessDrawer(`${m.use || ''} ${m.name || ''}`);
const useDrawer = u => { for (const lang of ['ko', 'de']) { const f = T[lang].uses.find(x => x[0] === u); if (f) return f[1]; } return ''; };

// Personenfilter: „für alle“ zählt bei jedem mit. / 사람 걸러 보기: '가족 모두' 약은 모두에게 보임.

const whoMatch = m => !WHO_OK[ui.who] || WHO_OK[ui.who].includes(m.who || '');
function qMatch(m) {
  const q = ui.q.trim().toLowerCase();
  return !q || [m.name, m.use, m.note, m.pzn, m.ean, L().kinds[m.kind], L().drawers[drawerOf(m)]].some(x => String(x || '').toLowerCase().includes(q));
}

// ---------- Zeichnungen / 약 그림 ----------
const PAL = ['#e04848', '#f08a24', '#2f7fd8', '#3a9a6a', '#8e44ad', '#16a085', '#e9b100', '#c0392b', '#5dade2', '#d35400'];

  if (k === 'syrup') return `<svg viewBox="0 0 60 90" ${st}><rect x="20" y="4" width="20" height="12" rx="3" fill="#fff" stroke="#d9cbb5"/><rect x="23" y="16" width="14" height="10" fill="#9a5a1c"/><path d="M14 34 q0-8 9-8 h14 q9 0 9 8 v46 q0 6-6 6 h-20 q-6 0-6-6z" fill="#b8661f"/><path d="M18 36 v40" stroke="#dc8b45" stroke-width="3" stroke-linecap="round"/>${label(14, 32)}</svg>`;
  if (k === 'spray') return `<svg viewBox="0 0 60 90" ${st}><path d="M26 2 h8 v6 h6 v4 h-6 v10 h-8z" fill="#fff" stroke="#c9c9c9"/><rect x="22" y="20" width="16" height="10" rx="2" fill="#fff" stroke="#c9c9c9"/><rect x="18" y="30" width="24" height="56" rx="8" fill="${c}"/><rect x="21" y="48" width="18" height="22" rx="2" fill="#fff"/><rect x="24" y="53" width="12" height="3" rx="1.5" fill="${c}"/></svg>`;
  if (k === 'drops') return `<svg viewBox="0 0 60 90" ${st}><path d="M27 4 h6 l3 14 h-12z" fill="#fff" stroke="#c9c9c9"/><rect x="21" y="18" width="18" height="12" rx="3" fill="#fff" stroke="#c9c9c9"/><rect x="16" y="30" width="28" height="56" rx="9" fill="${c}"/><rect x="19" y="48" width="22" height="22" rx="2" fill="#fff"/><rect x="22" y="53" width="14" height="3" rx="1.5" fill="${c}"/></svg>`;
  if (k === 'cream') return `<svg viewBox="0 0 60 90" ${st}><rect x="22" y="72" width="16" height="14" rx="3" fill="#fff" stroke="#c9c9c9"/><path d="M12 6 h36 l-8 66 h-20z" fill="#fff" stroke="#d6d6d6"/><path d="M12 6 h36 v4 h-36z" fill="#bbb"/><path d="M15 22 h30 l-3 26 h-24z" fill="${c}"/><rect x="21" y="30" width="18" height="3" rx="1.5" fill="#fff"/></svg>`;

}

// ---------- Speichern / 저장 ----------
function commit(m) {

let toastT;

// ---------- Startseite / 첫 화면 ----------
const groupKey = m => m.code || 'n:' + String(m.name || '').trim().toLowerCase();
// Gleiche Sorte zusammen (früheste zuerst). / 같은 약끼리 묶기(기한 빠른 것 먼저).
function groups(list) {

  for (const m of list.slice().sort(byLimit)) { const k = groupKey(m); if (!out.has(k)) out.set(k, []); out.get(k).push(m); }

}
function itemHtml(g) {

}

function render() {

// ---------- Blätter / 시트 ----------

function codeLinks(m) {
  const l = L(), out = [], g = q => `https://www.google.com/search?q=${encodeURIComponent(q)}`;
  // Koreanische Arzneimittel: offizielle Seite (의약품안전나라) mit Wirkung, Dosierung, Hinweisen.
  // 한국 약: 의약품안전나라 공식 상세 페이지(효능·용법·주의사항).
  if (m.itemSeq) out.push([`https://nedrug.mfds.go.kr/pbp/CCBBB01/getItemDetail?itemSeq=${encodeURIComponent(m.itemSeq)}`, l.findNedrug]);
  if (m.link && /^https?:\/\//i.test(m.link)) out.push([m.link, l.openQr]);
  const lf = m.leaflet || (catOf(m) || {}).leaflet;
  if (lf && /^https?:/i.test(lf)) out.push([lf, l.leafSrc]);
  if (m.pzn) {
    out.push([g('PZN ' + m.pzn), l.findName]);
    out.push([g(`PZN ${m.pzn} Beipackzettel`), l.findLeaflet]);
  } else if (m.itemSeq) {
    // schon oben / 위에서 이미 넣음
  } else if (m.ean && /^880/.test(m.ean)) {
    out.push([`https://search.naver.com/search.naver?query=${encodeURIComponent(m.name ? m.name + ' 복용법' : m.ean)}`, l.findNaver]);
  } else if (m.ean) out.push([g(m.ean), l.findGoogle]);
  else if (m.name) out.push([g(m.name + (S.lang === 'de' ? ' Beipackzettel' : ' 복용법')), l.findGoogle]);
  return out.length ? `<div class="links">${out.map(([u, t]) => `<a href="${esc(u)}" target="_blank" rel="noopener">${ms('open_in_new')}${esc(t)}</a>`).join('')}</div>` : '';
}
function codeInfo(m) {
  const l = L(), bits = [];
  if (m.pzn) bits.push(`PZN <b>${esc(m.pzn)}</b>`);
  if (m.ean) bits.push(`EAN <b>${esc(m.ean)}</b>`);
  if (m.entp) bits.push(`${esc(l.entp)} <b>${esc(m.entp)}</b>`);
  if (m.batch) bits.push(`${esc(l.batch)} <b>${esc(m.batch)}</b>`);
  if (m.serial) bits.push(`${esc(l.serial)} <b>${esc(m.serial)}</b>`);
  return bits.length ? `<div class="codeline">${bits.map(b => `<span>${b}</span>`).join('')}</div>` : '';
}

function newDraft(extra = {}) {
  return { id: uid(), name: '', kind: '', use: '', drawer: '', who: '', exp: '', bought: today(), opened: '', openDays: 0, dose: '', doseK1: '', doseK2: '', note: '', pzn: '', ean: '', code: '', batch: '', serial: '', created: Date.now(), ...extra };

// Ein gelesener Code → bekannte Packung öffnen oder neues Formular (mit Angaben derselben Sorte).
// 읽은 코드 → 이미 있는 같은 통이면 열고, 아니면 새 양식(같은 약을 전에 등록했으면 그 정보를 복사).
function handleCode(c) {
  const l = L();
  const code = MedCode.key(c);
  if (c.serial) {
    const same = Object.values(S.meds).find(m => m.code === code && m.serial === c.serial);
    if (same) { toast(l.sameBox); openDrawerOf(same); openSheet({ type: 'detail', id: same.id }); return; }
  }
  const prev = S.cat[code] || Object.values(S.meds).filter(m => m.code === code).sort((a, b) => (b.updated || 0) - (a.updated || 0))[0];
  const base = prev ? { ...fromCat(prev), copied: true } : {};
  if (base.info && base.info.use) fillKids(base, base.info.use, true);
  ui.draft = newDraft({ ...base, pzn: c.pzn, ean: c.ean, code, batch: c.batch, serial: c.serial, exp: c.exp, expScan: c.exp, ...(c.url ? { link: c.url } : {}) });
  ui.customDays = false;
  ui.krNote = !c.pzn && !c.ean && c.url ? { t: l.qrSaved } : null;
  openSheet({ type: 'form' });
  if (prev) toast(l.copied);
  if (/^880/.test(c.ean) && !(prev && prev.itemSeq && prev.info)) fillKorean(ui.draft.id, c.ean);
}

// ---------- Koreanische Arzneimittel / 한국 약 정보 ----------
// 1) Barcode → Name/Firma/품목기준코드 aus kd/NNN.json (HIRA-Liste, im App-Ordner, kein Schlüssel nötig).
// 2) Angemeldet: Wirkung, Anwendung, Hinweise von 의약품안전나라 über den eigenen Abruf-Server (auch Rx).
// 1) 바코드 → 이름·업체·품목기준코드: kd/NNN.json(심평원 목록, 앱 안에 있음, 키 필요 없음).
// 2) 로그인하면: 의약품안전나라의 효능·용법·주의사항(우리 가져오기 서버를 거침, 전문약도).
async function krByBarcode(ean) {
  const r = await fetch(`kd/${ean.slice(3, 6)}.json`);
  if (!r.ok) return null;
  const j = await r.json(), seq = j.c[ean.slice(6)];
  if (!seq || !j.i[seq]) return null;
  const [name, entp, form, rx] = j.i[seq];
  return { itemSeq: seq, name, entp, form, rx };
}
// Darreichungsform aus dem koreanischen Namen raten. / 한국 약 이름으로 종류 추측.
function kindFromName(n) {
  n = String(n || '');
  if (/점안|점이|점비|안약/.test(n)) return 'drops';
  if (/스프레이|분무|에어로솔|흡입/.test(n)) return 'spray';
  if (/연고|크림|겔|로션|패치|파스|외용/.test(n)) return 'cream';
  if (/좌제|좌약|좌산/.test(n)) return 'supp';
  if (/시럽|현탁|액|드링크|물약/.test(n)) return 'syrup';
  if (/정|캡슐|환|츄어블|산$|과립/.test(n)) return 'tab';
  return '';
}
async function fillKorean(id, ean) {
  const l = L(), same = () => ui.draft && ui.draft.id === id && ui.sheet && ui.sheet.type === 'form';
  // Nur neu zeichnen; Eingaben werden vor jeder Änderung mit readForm() übernommen.
  // 다시 그리기만 함. 입력값은 바꾸기 전에 readForm()으로 먼저 읽어 둠.
  const note = n => { if (same()) { ui.krNote = n; renderSheet(); } };
  readForm();
  note({ t: l.krLooking });
  let hit = null;
  try { hit = await krByBarcode(ean); } catch (e) { console.warn(e); }
  if (!same()) return;
  if (!hit) return note({ t: l.krNotFound });
  readForm();
  const d = ui.draft;
  if (!d.name) d.name = hit.name;
  if (!d.kind) d.kind = kindFromName(hit.name);
  d.itemSeq = hit.itemSeq; d.entp = hit.entp;
  note({ t: l.krFound, ok: true });
  // Beschreibung von 의약품안전나라 (nur angemeldet) / 의약품안전나라 설명(로그인했을 때만)
  if (!canFetch()) return note({ t: `${l.krFound} ${l.krNoLogin}`, ok: true });
  let info = null;
  try { info = await nedrugInfo(hit.itemSeq); } catch (e) { console.warn(e); }
  if (!same()) return;
  readForm();
  if (!info) return note({ t: `${l.krFound} ${l.krNoInfo}`, ok: true });
  const src = 'nedrug';
  d.info = { efcy: info.efcy, use: info.use, warn: info.warn, se: info.se, store: info.store, open: info.openText || '', lang: 'ko', src };
  if (!d.dose && (info.dose || info.use)) d.dose = info.dose || info.use;
  if (!d.drawer || d.drawerAuto) { d.drawer = guessDrawer(`${info.efcy} ${d.name}`); d.drawerAuto = true; }
  if (!+d.openDays && info.openDays) d.openDays = info.openDays;
  fillKids(d, info.use, false);
  note({ t: l.nedrugOk, ok: true });
}

// Über den eigenen Abruf-Server (nur angemeldete Familie). / 우리 가족 전용 가져오기 서버를 거침.
async function viaWorker(url) {

  detail(el) { openSheet({ type: 'detail', id: el.dataset.id }); },
  close() { closeSheet(); },
  bg(el, e) { if (e.target === el) closeSheet(); },
  new() { ui.draft = newDraft(); ui.customDays = false; ui.leafNote = null; ui.krNote = null; openSheet({ type: 'form' }); },
  edit(el) { ui.draft = { ...S.meds[el.dataset.id] }; ui.customDays = false; openSheet({ type: 'form' }); },
  set(el) {
    readForm(); const k = el.dataset.k;
    ui.draft[k] = k === 'openDays' ? +el.dataset.v : el.dataset.v;
    if (k === 'openDays') ui.customDays = false;
    if (k === 'drawer') delete ui.draft.drawerAuto;
    renderSheet();
  },
  'custom-days'() { readForm(); ui.customDays = true; renderSheet(); const i = $('#medform [name=openDays]'); if (i) i.focus(); },
  use(el) {
    readForm(); const d = ui.draft, v = el.dataset.v, u = (d.use || '').trim();
    if (!u.split(/,\s*/).includes(v)) d.use = u ? `${u}, ${v}` : v;
    // Erste Anwendung bestimmt die Schublade, solange niemand selbst eine gewählt hat.
    // 서랍을 직접 고르지 않았으면 처음 누른 용도로 서랍이 정해짐.
    if (!d.drawer || (d.drawerAuto && !u)) { d.drawer = useDrawer(v) || d.drawer; d.drawerAuto = true; }
    renderSheet();
  },
  'opened-today'() { readForm(); ui.draft.opened = today(); renderSheet(); },
  save() { saveForm(); },
  'open-today'(el) { const m = { ...S.meds[el.dataset.id], opened: today() }; commit(m); toast(L().openedDone); },
  gone(el) { const m = { ...S.meds[el.dataset.id], gone: today() }; commit(m); toast(L().goneDone); closeSheet(); },
  restore(el) { const m = { ...S.meds[el.dataset.id] }; delete m.gone; commit(m); },
  delete(el) { if (!confirm(L().confirmDel)) return; remove(el.dataset.id); closeSheet(); toast(L().deleted); },
  scan() { startScan(); },
  'scan-close'() { closeScan(); },
  'scan-type'() { sc.typing = !sc.typing; sc.err = ''; drawScan(); },
  'scan-photo'() { $('#photo').click(); },
  'use-cat'(el) {
    readForm();
    const e = S.cat[el.dataset.k];
    if (!e || !ui.draft) return;
    Object.assign(ui.draft, fromCat(e), { copied: true });
    if (e.info && e.info.use) fillKids(ui.draft, e.info.use, true);
    if (!ui.draft.code && e.code) Object.assign(ui.draft, { code: e.code, pzn: e.pzn || '', ean: e.ean || '' });
    renderSheet();
  },
  'leaf-pdf'() {
    const i = document.createElement('input'); i.type = 'file'; i.accept = 'application/pdf,.pdf';
    i.onchange = () => { const f = i.files[0]; if (f) leafRun(async () => MedLeaflet.parse(await pdfText(await f.arrayBuffer())), ''); };
    i.click();
  },
  'leaf-url'() {
    const u = ($('#leafurl').value || '').trim();
    if (!/^https?:/i.test(u)) { toast(L().leafUrlPh); return; }
    if (!canFetch()) { readForm(); ui.leafNote = { t: L().leafLogin }; renderSheet(); return; }
    leafRun(() => leafletFromUrl(u), u);
  },
  async translate(el) {
    const m = S.meds[el.dataset.id];
    if (!m || ui.trBusy) return;
    const e = catOf(m) || toCat(m), i = e.info || m.info;
    ui.trBusy = m.id; renderSheet();
    try {
      e.tr = e.tr || {};
      for (const t of trTexts(m, i)) if (!e.tr[hashId(t)]) e.tr[hashId(t)] = await translate(t);
    } catch (x) { console.warn(x); toast(x.message === 'quota' ? L().trQuota : L().trFail); }
    e.updated = Date.now();
    ui.trBusy = null;
    keep(); render(); if (window.cloud) window.cloud.push();
  },
  'kid-calc'() {
    readForm();
    const d = ui.draft, l = L(), info = d && (d.info || (catOf(d) || {}).info);
    if (!info || !info.use) { ui.leafNote = { t: l.kidCalcNeed }; renderSheet(); return; }
    if (KIDS.every(w => kidMonths(w) < 0)) { ui.leafNote = { t: l.kidNeedBirth }; renderSheet(); return; }
    const got = fillKids(d, info.use, true);
    ui.leafNote = { t: got.length ? l.kidCalcDone(got.join('·')) : l.kidCalcNone, ok: !!got.length };
    renderSheet();
  },
  'save-kids'() {
    const k = { updated: Date.now() };
    for (const w of KIDS) k[w] = { birth: $('#kb-' + w).value || '', kg: +$('#kk-' + w).value || 0 };
    S.cat['@kids'] = k;
    keep(); toast(L().kidsSaved); renderSheet(); render();
    if (window.cloud) window.cloud.push();
  },

  torch() { sc.torch = !sc.torch; sc.track.applyConstraints({ advanced: [{ torch: sc.torch }] }).catch(() => {}); drawScan(); },
  signin() { window.cloud.signIn().catch(e => console.warn(e)); },
  async signout() { await window.cloud.signOut(); renderSheet(); render(); },
  async join() { const c = window.cloud; c.note = ''; const ok = await c.join($('#housecode').value).catch(() => false); if (!ok) c.note = L().joinFail; renderSheet(); },
  async 'create-house'() { await window.cloud.create(); renderSheet(); },
  export() {
    const blob = new Blob([JSON.stringify({ app: 'meds', v: 1, meds: S.meds }, null, 1)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `약상자-${today()}.json`; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  },
  import() {
    const i = document.createElement('input'); i.type = 'file'; i.accept = 'application/json,.json';
    i.onchange = async () => {
      try {
        const d = JSON.parse(await i.files[0].text()), meds = d.meds || {};
        let n = 0;
        for (const id in meds) if (meds[id] && meds[id].name) { S.meds[id] = { ...meds[id], id }; n++; }
        keep(); render(); if (window.cloud) window.cloud.push(); toast(L().imported(n));
      } catch (e) { toast(String(e.message || e)); }
    };
    i.click();
  },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || !ACT[el.dataset.act]) return;
  if (el.dataset.act === 'bg' && e.target !== el) return;
  ACT[el.dataset.act](el, e);
});
$('#photo').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) fromPhoto(f); });
document.addEventListener('visibilitychange', () => { if (document.hidden && sc.on) closeScan(); });

render();
// Ablaufdaten wechseln um Mitternacht / 자정에 D-day 갱신
let lastDay = today();
setInterval(() => { if (today() !== lastDay) { lastDay = today(); render(); } }, 60000);
// Scanner im Leerlauf vorladen / 쉴 때 스캐너 미리 불러오기
setTimeout(() => getDetector().catch(() => {}), 2500);
window.meds = { S: () => S, handleCode, parse: MedCode.parse, render, _t: { htmlText, pdfText, leafRun, MedLeaflet } };

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (reloaded || !navigator.serviceWorker.controller) return;
    reloaded = true;
    if (!ui.sheet && !sc.on) location.reload();
  });
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
    document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update().catch(() => {}); });
  }).catch(() => {});
}
</script>
<script src="firebase-config.js"></script>
<script type="module">
// ---------- Familie teilen (Firebase) / 가족과 공유 ----------
// Gleiches Firebase-Projekt und gleicher Familiencode wie Einkaufsliste/Reisen; die Medikamente liegen im eigenen
// Dokument households/{Code}_meds als Karte meds.{id}. Jede Änderung geht als einzelnes Feld hoch.
// 장보기·여행과 같은 Firebase, 같은 가족 코드. 약은 households/{코드}_meds 문서의 meds.{id}에 저장.
// 바뀐 약만 필드 단위로 올려서 두 휴대폰이 서로 덮어쓰지 않게 함.
const cfg = window.FIREBASE_CONFIG;
if (cfg) {
  const V = 'https://www.gstatic.com/firebasejs/10.12.2/';
  const [{ initializeApp }, A, F] = await Promise.all(
    [import(V + 'firebase-app.js'), import(V + 'firebase-auth.js'), import(V + 'firebase-firestore.js')]);
  const fb = initializeApp(cfg), auth = A.getAuth(fb);
  const db = F.initializeFirestore(fb, { localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) });
  const S = () => window.meds.S();
  const keep = () => { try { localStorage.setItem('meds:v1', JSON.stringify(S())); } catch (e) {} };
  // Stabile Schreibweise auch für verschachtelte Felder (z. B. info). / 안쪽 객체까지 순서를 맞춘 비교용 글자.
  const deep = v => Array.isArray(v) ? v.map(deep) : v && typeof v === "object" ? Object.fromEntries(Object.keys(v).sort().map(k => [k, deep(v[k])])) : v;
  const sig = o => JSON.stringify(deep(o));
  const house = code => F.doc(db, "households", code);
  const warn = e => console.warn("sync", e);
  // Zwei Dokumente: Packungen (meds) und das Arzneimittel-Lexikon (cat), damit keines an die 1-MB-Grenze stößt.
  // 문서 두 개: 약 통(meds)과 약 사전(cat). 한 문서가 1MB 한도에 닿지 않게 나눔.
  const CH = [{ field: "meds", suffix: "_meds" }, { field: "cat", suffix: "_medcat" }];
  for (const c of CH) { c.unsub = null; c.first = true; c.ref = (code = S().house) => F.doc(db, "households", code + c.suffix); }

  function changes(c) {
    const out = {}, s = S(), base = (s.remote && s.remote[c.field]) || {}, local = s[c.field] || {};
    for (const id in local) if (!base[id] || sig(local[id]) !== sig(base[id])) out[`${c.field}.${id}`] = local[id];
    for (const id in base) if (!local[id]) out[`${c.field}.${id}`] = F.deleteField();
    return out;
  }
  function send(c) {
    const ch = changes(c), any = Object.keys(ch).length > 0;
    if (any) F.updateDoc(c.ref(), ch).catch(warn);
    return any;
  }
  function push() { for (const c of CH) if (c.unsub && !c.first && S().house) send(c); }
  function listenOne(c) {
    c.first = true;
    c.unsub = F.onSnapshot(c.ref(), async snap => {
      if (!snap.exists()) {
        // Erstes Gerät der Familie: Dokument anlegen; danach kommt der Schnappschuss erneut.
        // 가족 중 처음 쓰는 기기: 문서를 만들면 다시 알림이 옴.
        await F.setDoc(c.ref(), { [c.field]: {}, created: Date.now() }, { merge: true }).catch(warn);
        return;
      }
      if (c.first) { c.first = false; if (send(c)) return; }
      const d = snap.data(), s = S();
      s.remote = s.remote || {};
      s.remote[c.field] = JSON.parse(JSON.stringify(d[c.field] || {}));
      s[c.field] = JSON.parse(JSON.stringify(d[c.field] || {}));
      keep();
      window.meds.render();
    }, warn);
  }
  function listen() { stop(); for (const c of CH) listenOne(c); }
  function stop() { for (const c of CH) { if (c.unsub) c.unsub(); c.unsub = null; } }
  const listening = () => CH.some(c => c.unsub);
  async function link(code) {
    const s = S(); s.house = code; s.remote = null; keep();
    await F.setDoc(F.doc(db, "users", auth.currentUser.uid), { house: code }, { merge: true });
    listen(); window.meds.render();
  }

  window.cloud = {
    ready: false, user: null, note: '', push,
    // Für den Abruf-Server (meds-fetch): Anmeldenachweis / 설명서 가져오기 서버용 로그인 증명
    token: () => auth.currentUser ? auth.currentUser.getIdToken() : Promise.resolve(null),
    signIn: () => A.signInWithPopup(auth, new A.GoogleAuthProvider()),
    async signOut() { stop(); const s = S(); delete s.house; delete s.remote; keep(); await A.signOut(auth); },
    async create() {
      const abc = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      const code = [...crypto.getRandomValues(new Uint8Array(10))].map(n => abc[n % abc.length]).join('');
      await F.setDoc(house(code), { stores: {}, items: {}, stock: {}, created: Date.now() });
      await link(code);
    },
    async join(code) {
      code = String(code || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (!code || !(await F.getDoc(house(code))).exists()) return false;
      await link(code);
      return true;
    },
  };

  A.onAuthStateChanged(auth, async user => {
    window.cloud.user = user;
    const s = S();
    if (!user) stop();
    else {
      if (!s.house) try {
        const u = await F.getDoc(F.doc(db, 'users', user.uid));
        if (u.exists() && u.data().house) { s.house = u.data().house; s.remote = null; keep(); }
      } catch (e) { warn(e); }
      if (s.house && !listening()) listen();
    }
    window.cloud.ready = true;
    window.meds.render();
  });
}
</script>
